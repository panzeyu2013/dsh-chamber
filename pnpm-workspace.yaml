packages:
  - "packages/*"
  - "vendor/harness-packages/@deepseek-ai/*"

# pnpm 11：非 auth settings 只认 pnpm-workspace.yaml（.npmrc 已无效）。
# 关闭「pnpm run/exec 前隐式 install」：隐式 install 是非 frozen 的，会撞
# preinstall 的 vendor 链接差量窗口、且极端情况下会把 pnpm-lock.yaml 改写成
# 裁剪版（符号链接成员的 importer 记录剪枝），之后所有 frozen install 全挂。
# 依赖变更请显式 `pnpm install`；CI 始终显式 frozen install，不依赖本配置。
# 已知 pnpm#12019：嵌套 pnpm run 时本配置可能被覆盖失效——本地若见到
# "Lockfile is up to date / 自动 install" 输出即失效信号，需显式 install。
verifyDepsBeforeRun: false

# pnpm 11 默认拦截依赖构建脚本；白名单放行本仓库安装树中的合法构建：
# electron/electron-builder（二进制下载）、esbuild/@parcel/watcher（vite 依赖原生安装）。
allowBuilds:
  electron: true
  electron-builder: true
  esbuild: true
  "@parcel/watcher": true
  # Windows 打包辅助（macOS 上其下载脚本无害）
  electron-winstaller: true
  # 工作区成员 dsh-subprocess-local 自身的 postinstall（恢复 node-pty
  # spawn-helper 可执行位）不受 allowBuilds 约束——pnpm 对 workspace 项目
  # 自身脚本在全新安装时无条件执行，其 node-pty 解析失败由
  # scripts/dev/ensure-harness-vendor.mjs 的解析 shim 兜底（解析成功后为
  # 无害 no-op）。此处否认的是它作为"依赖节点"的构建（成员间 workspace:
  # 引用时的防御），同时避免 pnpm 报 ignored builds。运行时用 bundle:dsh
  # 的发布包、不构建上游源码，该脚本非必需。
  "@deepseek-ai/dsh-subprocess-local": false
  # 原生模块（经工作区 linked 包引入）：chamber 树不构建/不执行它们——运行时
  # 由 bundle:dsh 的独立安装树自带（单源清单见
  # packages/dsh-runtime/src/allow-builds.mjs 的 ALLOW_BUILDS；bundle-dsh.mjs
  # 只经 renderAllowBuildsBlock() 消费，本仓已无第二份副本）。
  # 显式否认，避免 pnpm 报 ignored builds。
  # node-pty 同时作为根 devDependency 提升到根 node_modules（见 package.json），
  # 仅作 dsh-subprocess-local postinstall 的 import.meta.resolve 解析目标
  # （配合 ensure-harness-vendor.mjs 的快照解析 shim）；构建仍否认——本树
  # 不需要其原生二进制。
  "node-pty": false
  "koffi": false
  # fs-ext（session-persistence-jsonl 写租约 flock 所用）：同为
  # 原生模块——chamber 树不构建/不执行（运行时由 bundle:dsh 独立安装树自带，
  # 见 dsh-runtime/src/allow-builds.mjs 的 ALLOW_BUILDS 清单）。显式否认，
  # 避免 pnpm 报 ignored builds。
  "fs-ext": false
  "protobufjs": false
  "@google/genai": false
  # msgpackr-extract（msgpackr 的原生加速器）：由上游私有桌面应用构建面引入
  # （apps/desktop 的种子脚本用 msgpackr；上游 packages/** 无该依赖）。运行时闭包
  # 不含它（packages/desktop/vendor/dsh/pnpm-lock.yaml 对 msgpackr* 零命中），
  # 故这里是惰性的防御性 false；显式否认避免 pnpm 报 ignored builds。
  "msgpackr-extract": false

# app-builder-lib 26.15.3 声明 @electron/get@^3.0.0，但 3.0.0 缺少其代码引用的
# ElectronDownloadCacheMode 导出（3.1.0 才有）；锁文件在 3.1.0 发布前生成，
# pnpm 不会在满足范围内重解析，故显式钉住。electron 自身依赖的 v5 不受影响。
overrides:
  "@electron/get@^3.0.0": "3.1.0"

minimumReleaseAgeExclude:
  - '@deepseek-ai/libreoffice-kit-darwin-arm64@0.1.1'
  - '@deepseek-ai/libreoffice-kit-darwin-x64@0.1.1'
  - '@deepseek-ai/libreoffice-kit-wasm@0.1.1'
  - '@deepseek-ai/libreoffice-kit-win32-arm64@0.1.1'
  - '@deepseek-ai/libreoffice-kit-win32-x64@0.1.1'
  - '@deepseek-ai/libreoffice-kit@0.1.1'

# 上游 pnpm patch channel（§17-C，与 vendor pin 逐字一致）：集合与字节来自
# vendor/harness-checkout/{pnpm-workspace.yaml,patches/}，仓内 patches/ 为其副本；
# registry 的 patches 字段是单一登记面，scripts/upstream/registry.test.mjs 对拍。
# allowUnusedPatches：本仓 dev 安装图只用其中一部分（其余属上游 dev/build 图）。
patchedDependencies:
  '@earendil-works/pi-ai@0.85.1': patches/@earendil-works__pi-ai@0.85.1.patch
  '@electron/osx-sign@1.3.3': patches/@electron__osx-sign@1.3.3.patch
  '@fortune-sheet/core@1.0.4': patches/@fortune-sheet__core@1.0.4.patch
  '@fortune-sheet/react@1.0.4': patches/@fortune-sheet__react@1.0.4.patch
  '@yao-pkg/pkg@6.21.0': patches/@yao-pkg__pkg@6.21.0.patch
  exceljs@4.4.0: patches/exceljs@4.4.0.patch
  node-pty@1.2.0-beta.15: patches/node-pty@1.2.0-beta.15.patch
allowUnusedPatches: true
