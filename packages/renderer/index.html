<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dsh-chamber</title>
    <!-- 启动骨架屏关键 CSS（首帧观感优化，2026-08）：首帧在 HTML 解析时即可
         绘制，不依赖全量 chamber CSS 与首屏 JS 的加载/求值（体积会随上游 dsh
         版本漂移，勿在此写死数字；实测分账见 docs/progress/performance-baseline.md）。
         骨架用独立的 dsh-boot-* 命名空间：chamber CSS 无同名规则，全量样式加载后
         不会覆盖大字号品牌块（否则 .instance-loading-title 的 14px 会压掉 40px
         品牌字）。React createRoot 首次 render 会清空 #root 的既有子节点，mount
         时骨架被 InstanceView 的同视觉语言骨架无缝替换——不会出现双骨架/FOUC。
         注意：骨架只改善 FCP/观感，不构成最终 LCP（被移除的候选会被过滤，且
         真实 UI 的元素更大），LCP 仍由真实首帧决定。 -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: #0f1115;
        color: #e6e9ef;
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
      }
      .dsh-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1115;
      }
      .dsh-boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      .dsh-boot-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        /* ui-theme's corner-shape.css smooths every corner to a superellipse
           once the dsh bundle lands, and the boot skeleton is still on screen
           until React mounts — an unpaired 50% radius would render the ring as
           a wobbling squircle. Every full-round radius pairs the keyword
           (ui-theme's corner-shape spec). */
        corner-shape: round;
        border: 2px solid #262c38;
        border-top-color: #4f8cff;
        animation: dsh-boot-spin 0.8s linear infinite;
      }
      .dsh-boot-brand {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.03em;
        line-height: 1.15;
        color: #e6e9ef;
      }
      .dsh-boot-hint {
        font-size: 13px;
        color: #8b94a7;
      }
      @keyframes dsh-boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .dsh-boot-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 静态首帧骨架（观感/首帧画布）：HTML 解析即绘制，React mount 时被
           替换清除。真实 UI 帧（settle 后）才是 LCP 的最终候选。 -->
      <div class="dsh-boot" aria-busy="true">
        <div class="dsh-boot-inner">
          <div class="dsh-boot-spinner" aria-hidden="true"></div>
          <div class="dsh-boot-brand">dsh-chamber</div>
          <!-- T16（2026-09-11 upstream-alignment）：静态骨架的文案是「服务端 markup
               的默认语言」那一份（本文件声明 lang="zh-CN"，与 locales.ts 的兜底
               语言同源）——它不是框架代码，读不到 typed 字典；main.tsx 在 React
               mount 前用字典的 'boot.starting' 覆盖它，因此英文文档立即拿到英文。
               data-chamber-boot-hint 是该覆盖的唯一挂钩。 -->
          <div class="dsh-boot-hint" data-chamber-boot-hint>正在启动…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
