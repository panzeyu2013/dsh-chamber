name: Release

# Tag-triggered (v*) or manual (workflow_dispatch) desktop release, modeled
# on OpenChamber's release.yml: an ubuntu job creates a draft GitHub Release
# first, per-platform jobs build and PUBLISH their artifacts into it
# (electron-builder --publish with GH_TOKEN — this is what generates and
# uploads the update feed, see below), and a finalize job flips the draft to
# public. Since design 11 (desktop auto-update) each platform also ships its
# UPDATE FEED: Windows uploads the NSIS exe + latest.yml (beta.yml for beta),
# macOS uploads the dmg + zip + latest-mac.yml (beta-mac.yml for beta) — the
# feed files electron-updater's github provider consumes. The channel is
# derived by electron-builder from the VERSION's semver prerelease tag
# (0.2.0 → latest.yml; 0.2.0-beta.1 → beta.yml); a beta release is
# additionally created as a GitHub prerelease. NO .blockmap sidecars ship
# (2026-08 decision): Windows has differentialPackage=false (no exe.blockmap)
# and the mac zip's hardcoded .zip.blockmap is deleted from the draft release
# before finalize — the feeds never reference blockmaps, so updates fall back
# to full downloads. macOS v1 ships arm64 ONLY:
# macos-13, the last public Intel x64 runner, was retired by GitHub — its
# matrix leg stuck queued forever in every v0.1.0 run (Intel Macs are
# unsupported in v1, see STATUS.md); macos-14 is deprecated (2026-07) and
# unsupported by 2026-11, so the mac leg runs on macos-latest (= macOS 26,
# arm64 — the 2026-08 v0.1.2 release decision). Windows builds on windows-2022
# (windows-latest's VS 18 toolchain is not detected correctly by the node-gyp
# stack — same finding as OpenChamber). Public publication is fail-closed:
# macOS requires Developer ID signing plus Apple notarization credentials and
# verifies the signature, Gatekeeper assessment and stapled ticket; Windows
# requires Authenticode credentials and verifies the emitted installer. A
# dry-run may still produce local unsigned/ad-hoc artifacts for build testing,
# but those artifacts are never finalized as a public release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release — MUST equal packages/desktop/package.json version (and the sibling chamber packages). Beta = a semver prerelease suffix (e.g. 0.2.0-beta.1): electron-builder derives the beta.yml/beta-mac.yml feed from it and the release is marked prerelease.'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip publishing — build-only; note: an empty draft release is still created)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# A same-tag double run (re-dispatch / tag re-push while a run is in flight)
# would interleave two drafts/uploads on the same tag — cancel the older run
# so the tag always has exactly one coherent draft→finalize sequence
# (2026-08 review NIT).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_CHAMBER_DSH_VERSION: 0.1.0-rc.8

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      # softprops/action-gh-release exposes the created release id — finalize
      # uses it (not a tag lookup) to enumerate/delete assets, because the
      # tags/{tag} endpoint does not reliably resolve a DRAFT release and a
      # bare `gh api` failure used to be swallowed (2026-08 postmortem).
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get version
        id: get_version
        env:
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ -n "$RELEASE_INPUT_VERSION" ]]; then
            echo "version=$RELEASE_INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert version matches package.json
        # electron-builder uploads to tag v<BUILT version> (from
        # packages/desktop/package.json), and the softprops draft above uses
        # tag v<workflow version> — a mismatch would silently redirect every
        # artifact to a phantom v<package.json version> draft and finalize an
        # EMPTY release. Fail fast: the developer bumps the chamber packages
        # (design 11 §8: root/desktop/control-plane/renderer/cli +
        # dsh-host-client-graph + dsh-host-git-worktree — 7 packages) before
        # releasing, so the input version must equal EVERY package's version.
        # (2026-08 review: extended from desktop-only so a partial bump of the
        # siblings fails the run instead of shipping a version-skewed app.)
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          for PKG in \
            ./package.json \
            ./packages/desktop/package.json \
            ./packages/control-plane/package.json \
            ./packages/renderer/package.json \
            ./packages/cli/package.json \
            ./packages/dsh-host-client-graph/package.json \
            ./packages/dsh-chamber-host-git-worktree/package.json; do
            PKG_VERSION=$(node -p "require('${PKG}').version")
            if [[ "$VERSION" != "$PKG_VERSION" ]]; then
              echo "::error::release version ${VERSION} != ${PKG} version ${PKG_VERSION} — bump all 7 chamber packages (root/desktop/control-plane/renderer/cli/dsh-host-client-graph/dsh-host-git-worktree) to match before releasing"
              exit 1
            fi
          done
          echo "release version ${VERSION} matches all 7 chamber packages ✓"

      - name: Extract CHANGELOG section for the release body
        # The release page must show OUR changelog entry (CHANGELOG.md), not
        # GitHub's auto-generated commit list (generate_release_notes) — the
        # user-facing release record lives in the repo file. Extract the
        # matching "## [<version>]" section (Keep a Changelog format); a
        # missing section fails loudly (never publish with an empty body).
        id: changelog_body
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          SECTION=$(awk '
            $0 ~ /^## \['"$VERSION"'\]/ { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [[ -z "$SECTION" ]]; then
            echo "::error::CHANGELOG.md has no section for [${VERSION}] — add one before releasing"
            exit 1
          fi
          echo "$SECTION" > /tmp/release-body.md
          echo "extracted $(wc -l < /tmp/release-body.md) lines for [${VERSION}]"

      # This check must precede every mutation of GitHub release state. In
      # particular, never delete an existing same-tag release and only then
      # discover that the replacement cannot be signed or notarized.
      - name: Fail closed before mutating public-release state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          set -euo pipefail
          test -n "$MAC_CSC_LINK"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$WIN_CSC_LINK"

      - name: Delete any existing release for this tag
        # 2026-08 postmortem (body_path not applied — softprops log:
        # "Using release <old> for tag v0.1.2 instead of duplicate draft <new>
        # / Removing duplicate draft"): deleting a GIT TAG does NOT delete the
        # GitHub RELEASE — the release record survives DETACHED (the
        # tags/{tag} endpoint then 404s even though the release still exists,
        # and re-pushing the tag makes softprops FIND the old release and
        # UPDATE it, discarding the freshly-created draft that carried our
        # CHANGELOG body). So we must enumerate ALL releases and delete by
        # tag_name — the list endpoint sees detached releases — not resolve
        # via tags/{tag}. Missing release is fine (nothing to do); any gh api
        # error fails loud. Skipped on dry_run (build-only).
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.version }}"
          EXISTING_IDS=$(gh api \
            "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.tag_name == "v'"${VERSION}"'") | .id')
          if [[ -z "$EXISTING_IDS" ]]; then
            echo "no existing release for v${VERSION} — fresh draft will be created"
            exit 0
          fi
          for EXISTING_ID in $EXISTING_IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/${EXISTING_ID}" >/dev/null
            echo "deleted existing release ${EXISTING_ID} for v${VERSION} (will create fresh)"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (draft)
        id: create_release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          draft: true
          # Prerelease derived from the VERSION's semver prerelease suffix
          # (v0.2.0-beta.1 → prerelease). Deriving from the workflow input
          # would be empty on tag-push and could publish a beta feed to a
          # non-prerelease release — which stable clients would then treat as
          # the latest and 404 on latest.yml.
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
          body_path: /tmp/release-body.md
          name: dsh-chamber v${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-release
    permissions:
      contents: write
    # Public arm64 runner label only (OpenChamber 踩坑：非公开标签
    # macos-26 / macos-15-intel 会找不到 runner 而失败)。v1 ships arm64 only:
    # macos-13, the last public x64 runner, is retired; macos-14 is deprecated
    # (2026-07) and fully unsupported by 2026-11, so the mac leg builds on
    # macos-latest (= macOS 26, arm64; 2026-08 v0.1.2 按 macOS 26 发布的
    # 决定)。bundle:dsh bakes the host platform's dsh runtime, so x64 cannot
    # be cross-built on an arm64 runner without Rosetta toolchain work
    # (deferred, see STATUS.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Cache pinned harness snapshot
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: vendor/harness-checkout
          key: harness-${{ hashFiles('harness.commit') }}
      - name: Bootstrap vendor tree
        run: node scripts/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile

      - name: Require Apple signing and notarization credentials for publication
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Build and package macOS app (arm64)
        # electron-builder runs the afterPack structural ad-hoc fallback first; when
        # publication credentials are present its normal signing/notarization stages
        # replace that fallback with the release identity. publish=always (unless
        # dry_run) uploads every artifact into the draft release created
        # above — INCLUDING the update feed (zip + latest-mac.yml /
        # beta-mac.yml) that electron-updater consumes (design 11 §6):
        # update-info files are only generated when a publish policy other
        # than "never" is active.
        run: |
          pnpm run build:desktop
          pnpm --filter @dsh-chamber/desktop exec electron-builder --mac --arm64 --publish=${{ github.event.inputs.dry_run == 'true' && 'never' || 'always' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify packaged macOS app and public-release identity
        # Every build must be structurally valid. A public build additionally
        # proves Developer ID identity, Gatekeeper acceptance and stapling.
        run: |
          set -euo pipefail
          APP_DIR=$(find packages/desktop/release -maxdepth 2 -name "*.app" -type d | head -n 1)
          test -n "$APP_DIR"
          echo "app bundle: $APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          RUNTIME="$APP_DIR/Contents/Resources/vendor/dsh"
          test -f "$RUNTIME/node_modules/@deepseek-ai/dsh/package.json"
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('$RUNTIME/package.json','utf8'));if(!p.dsh?.platform?.startsWith('darwin-')){throw new Error('wrong bundled dsh platform: '+p.dsh?.platform)};console.log('bundled dsh: '+(p.dependencies?.['@deepseek-ai/dsh']??'?')+' ('+p.dsh.platform+')')"
          test -n "$(ls packages/desktop/release/*.dmg 2>/dev/null | head -n 1)"
          if [[ "${{ github.event.inputs.dry_run }}" != "true" ]]; then
            codesign -dv --verbose=4 "$APP_DIR" 2>&1 | grep -q 'Authority=Developer ID Application:'
            spctl --assess --type execute --verbose=2 "$APP_DIR"
            xcrun stapler validate "$APP_DIR"
            test -n "$(ls packages/desktop/release/*.zip 2>/dev/null | head -n 1)"
            test -n "$(ls packages/desktop/release/*-mac.yml 2>/dev/null | head -n 1)"
          fi

  build-windows:
    needs: create-release
    permissions:
      contents: write
    # windows-2022, not windows-latest: the node-gyp stack does not detect the
    # VS 18 toolchain that windows-latest ships (same finding as OpenChamber).
    # x64 only — bundle:dsh bakes native modules (node-pty etc.) for the host
    # platform; arm64 would need an arm64 runner, not cross-compilation.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Cache pinned harness snapshot
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: vendor/harness-checkout
          key: harness-${{ hashFiles('harness.commit') }}
      - name: Bootstrap vendor tree
        run: node scripts/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile

      - name: Require Windows Authenticode credentials for publication
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) { throw 'WIN_CSC_LINK is required for a public release' }

      - name: Build and package Windows app
        shell: bash
        run: |
          pnpm run build:desktop
          pnpm --filter @dsh-chamber/desktop exec electron-builder --win --x64 --publish=${{ github.event.inputs.dry_run == 'true' && 'never' || 'always' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify packaged Windows app and public-release identity
        # Assert the runner is win32-x64 (bundle:dsh bakes the host platform)
        # and that the win32 dsh runtime made it into the unpacked app. When
        # not dry-running, also assert the UPDATE FEED (design 11 §6): the
        # channel yml electron-updater consumes. NO .blockmap is expected
        # (2026-08: differentialPackage=false — the feed never references a
        # blockmap, updates fall back to full downloads).
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform + "-" + process.arch')" = "win32-x64"
          test -d packages/desktop/release/win-unpacked
          RUNTIME=packages/desktop/release/win-unpacked/resources/vendor/dsh
          test -f "$RUNTIME/node_modules/@deepseek-ai/dsh/package.json"
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('$RUNTIME/package.json','utf8'));if(!p.dsh?.platform?.startsWith('win32-')){throw new Error('wrong bundled dsh platform: '+p.dsh?.platform)};console.log('bundled dsh: '+(p.dependencies?.['@deepseek-ai/dsh']??'?')+' ('+p.dsh.platform+')')"
          test -n "$(ls packages/desktop/release/*.exe 2>/dev/null | head -n 1)"
          if [[ "${{ github.event.inputs.dry_run }}" != "true" ]]; then
            powershell -NoProfile -Command '$exe = Get-ChildItem "packages/desktop/release/*.exe" | Select-Object -First 1; $sig = Get-AuthenticodeSignature $exe.FullName; if ($sig.Status -ne "Valid") { throw "invalid Authenticode signature: $($sig.Status)" }'
            test -z "$(ls packages/desktop/release/*.blockmap 2>/dev/null | head -n 1)"
            test -f packages/desktop/release/latest.yml -o -f packages/desktop/release/beta.yml
          fi

  finalize-release:
    needs: [create-release, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Drop mac zip.blockmap assets from the draft release
        # 2026-08 (v0.1.2 postmortem): electron-builder hardcodes the mac zip
        # target's isWriteUpdateInfo=true (MacPackager.createTargets), so the
        # mac leg always uploads a .zip.blockmap sidecar. The feeds never
        # reference it (latest-mac.yml carries only zip sha512/size/url), so
        # it is deleted from the DRAFT before finalize — releases ship without
        # any .blockmap (Windows has differentialPackage=false already). The
        # blockmap is harmless-but-extra; deleting keeps the artifact list
        # minimal and matches the v0.1.1 release shape.
        #
        # Resolved by RELEASE ID from create-release (not tags/{tag} — that
        # endpoint does not reliably resolve a draft). FAILS LOUD on any gh
        # api error (the first version swallowed failures with `|| true`,
        # leaving the blockmap in the published release).
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="${{ needs.create-release.outputs.release_id }}"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "::error::create-release did not expose a release id — cannot clean blockmap assets"
            exit 1
          fi
          ASSET_IDS=$(gh api \
            "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name | endswith(".blockmap")) | .id')
          if [[ -z "$ASSET_IDS" ]]; then
            echo "no .blockmap assets in draft release — nothing to drop"
            exit 0
          fi
          for ASSET_ID in $ASSET_IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID" >/dev/null
            echo "dropped .blockmap asset $ASSET_ID"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release (flip draft to public)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
