name: Release

# Tag-triggered (v*) or manual (workflow_dispatch) desktop release, modeled
# on OpenChamber's release.yml: an ubuntu job creates a draft GitHub Release
# first, per-platform jobs build and PUBLISH their artifacts into it
# (electron-builder --publish with GH_TOKEN — this is what generates and
# uploads the update feed, see below), and a finalize job flips the draft to
# public. Since design 11 (desktop auto-update) each platform also ships its
# UPDATE FEED: stable builds use the package's GitHub publish configuration
# and upload latest.yml / latest-mac.yml / latest-linux.yml; canonical beta.N
# builds select the explicit electron-builder.beta.yml configuration and
# upload beta.yml / beta-mac.yml / beta-linux.yml (linux leg added 2026-12,
# design 21).
# The two channels are generated, verified, and consumed independently — beta
# never overwrites the stable feed. A beta is also a GitHub prerelease. NO
# .blockmap sidecars ship
# (2026-08 decision): Windows has differentialPackage=false (no exe.blockmap)
# and the mac zip's hardcoded .zip.blockmap is deleted from the draft release
# before finalize — the feeds never reference blockmaps, so updates fall back
# to full downloads. macOS v1 ships arm64 ONLY:
# macos-13, the last public Intel x64 runner, was retired by GitHub — its
# matrix leg stuck queued forever in every v0.1.0 run (Intel Macs are
# unsupported in v1, see STATUS.md); macos-14 is deprecated (2026-07) and
# unsupported by 2026-11, so the mac leg runs on macos-latest (= macOS 26,
# arm64 — the 2026-08 v0.1.2 release decision). Windows builds on windows-2022
# (windows-latest's VS 18 toolchain is not detected correctly by the node-gyp
# stack — same finding as OpenChamber). Formal macOS releases require signing
# and notarization credentials (CSC_LINK/CSC_KEY_PASSWORD + APPLE_ID/
# APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID); the verify step then fails closed
# unless the .app carries a Developer ID signature and a valid stapled
# notarization ticket, so a missing/misconfigured secret can never publish an
# ad-hoc build as a formal release (finalize waits on build-macos). Dry runs
# stay ad-hoc tolerant (no secrets → ad-hoc via the afterPack hook, which is a
# structurally valid signature so no "app is damaged" on Gatekeeper-relaxed
# systems; a default Gatekeeper still requires right-click/open or "allow
# anywhere"). The Windows exe goes out unsigned — its auto-install proceeds
# with a SmartScreen warning (documented tradeoff, design 11 §7); the macOS
# INSTALL step is blocked without a Developer ID signature (design 11 §3.1).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release — MUST equal every chamber package and be stable X.Y.Z or canonical X.Y.Z-beta.N. Beta selects the isolated beta.yml/beta-mac.yml feed and GitHub prerelease.'
        required: true
        type: string
      dry_run:
        description: 'Dry run (build and validate only; do not create, update, or publish a GitHub Release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# GitHub's latest release/feed are shared mutable state. Serialize release
# publication and never cancel a run after it may have created a draft or
# uploaded assets; a later run waits and then re-checks remote state.
concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  DSH_CHAMBER_DSH_VERSION: 0.1.5-rc.2

jobs:
  create-release:
    # All GitHub Release mutations happen only after this commit passes the
    # release-local validation gate. A broken tag/manual run must not delete
    # or replace an existing release before tests finish.
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      # softprops/action-gh-release exposes the created release id — finalize
      # uses it (not a tag lookup) to enumerate/delete assets, because the
      # tags/{tag} endpoint does not reliably resolve a DRAFT release and a
      # bare `gh api` failure used to be swallowed (2026-08 postmortem).
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Commit/tag identity is a release authority boundary. Full history
          # is required to resolve and peel an existing annotated tag.
          fetch-depth: 0

      - name: Get version
        id: get_version
        env:
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ -n "$RELEASE_INPUT_VERSION" ]]; then
            VERSION="$RELEASE_INPUT_VERSION"
          elif [[ "$RELEASE_REF" == refs/tags/* ]]; then
            VERSION="${RELEASE_REF#refs/tags/v}"
          else
            VERSION="0.0.0-dev"
          fi
          # Validate before writing the value to GITHUB_OUTPUT or interpolating
          # it into later shell steps. Manual workflow inputs are data, never
          # shell syntax or output-file control records.
          if ! node scripts/release/release-semver.mjs channel "$VERSION" >/dev/null; then
            echo "::error::release version must be canonical SemVer without build metadata"
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bind release tag to the checked-out commit
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TAG_REF="refs/tags/${TAG}"
          CHECKOUT_SHA=$(git rev-parse HEAD^{commit})
          if [[ "$CHECKOUT_SHA" != "$RELEASE_SHA" ]]; then
            echo "::error::checkout ${CHECKOUT_SHA} does not match workflow SHA ${RELEASE_SHA}"
            exit 1
          fi
          if [[ "$RELEASE_EVENT" == "push" && "$RELEASE_REF" != "$TAG_REF" ]]; then
            echo "::error::tag-triggered release ref ${RELEASE_REF} does not match ${TAG_REF}"
            exit 1
          fi
          if git show-ref --verify --quiet "$TAG_REF"; then
            TAG_SHA=$(git rev-parse "${TAG}^{commit}")
            if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
              echo "::error::${TAG} peels to ${TAG_SHA}, not workflow SHA ${RELEASE_SHA}"
              exit 1
            fi
            echo "${TAG} is bound to checked-out commit ${RELEASE_SHA}"
          elif [[ "$RELEASE_EVENT" == "push" ]]; then
            echo "::error::tag push ${TAG_REF} is missing from the fetched repository"
            exit 1
          else
            echo "${TAG} does not exist; GitHub Release creation must target ${RELEASE_SHA} explicitly"
          fi

      - name: Assert version matches package.json
        # electron-builder uploads to tag v<BUILT version> (from
        # packages/desktop/package.json), and the softprops draft above uses
        # tag v<workflow version> — a mismatch would silently redirect every
        # artifact to a phantom v<package.json version> draft and finalize an
        # EMPTY release. Fail fast: design 11 §8 requires the root and every
        # non-fork chamber package to be bumped together, while the
        # @deepseek-ai/* source forks retain their pinned upstream version.
        # The input version must therefore match every package it owns.
        # The preflight scanner is data-driven: new packages are automatically
        # covered, while @deepseek-ai/* fork copies stay on their pinned upstream
        # baseline. Do not replace this with a hard-coded package list.
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: node scripts/release/release-preflight.mjs "$VERSION" --versions-only

      - name: Extract CHANGELOG section for the release body
        # The release page must show OUR changelog entry (CHANGELOG.md), not
        # GitHub's auto-generated commit list (generate_release_notes) — the
        # user-facing release record lives in the repo file. Extract the
        # matching "## [<version>]" section (Keep a Changelog format); a
        # missing section fails loudly (never publish with an empty body).
        id: changelog_body
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          SECTION=$(awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [[ -z "$SECTION" ]]; then
            echo "::error::CHANGELOG.md has no section for [${VERSION}] — add one before releasing"
            exit 1
          fi
          echo "$SECTION" > /tmp/release-body.md
          echo "extracted $(wc -l < /tmp/release-body.md) lines for [${VERSION}]"

      - name: Require macOS release signing credentials before mutation
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" || -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "::error::formal releases require CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID"
            exit 1
          fi
      - name: Refuse published release and replace stale drafts for this tag
        # 2026-08 postmortem (body_path not applied — softprops log:
        # "Using release <old> for tag v0.1.2 instead of duplicate draft <new>
        # / Removing duplicate draft"): deleting a GIT TAG does NOT delete the
        # GitHub RELEASE — the release record survives DETACHED (the
        # tags/{tag} endpoint then 404s even though the release still exists,
        # and re-pushing the tag makes softprops FIND the old release and
        # UPDATE it, discarding the freshly-created draft that carried our
        # CHANGELOG body). So we must enumerate ALL releases by tag_name — the
        # list endpoint sees detached releases — not resolve via tags/{tag}.
        # Published releases are immutable here: a sequential rerun fails
        # closed before touching one. Only stale drafts may be recreated.
        # Skipped on dry_run, which performs zero GitHub Release mutations.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          EXISTING_RELEASES=$(gh api --paginate --slurp \
            "repos/${{ github.repository }}/releases?per_page=100" \
            | jq -r --arg tag "v${VERSION}" '.[][] | select(.tag_name == $tag) | [.id, .draft] | @tsv')
          if [[ -z "$EXISTING_RELEASES" ]]; then
            echo "no existing release for v${VERSION} — fresh draft will be created"
            exit 0
          fi
          DRAFT_IDS=()
          PUBLISHED_IDS=()
          while IFS=$'\t' read -r EXISTING_ID IS_DRAFT; do
            [[ -n "$EXISTING_ID" ]] || continue
            if [[ "$IS_DRAFT" == "true" ]]; then
              DRAFT_IDS+=("$EXISTING_ID")
            else
              PUBLISHED_IDS+=("$EXISTING_ID")
            fi
          done <<< "$EXISTING_RELEASES"

          if (( ${#PUBLISHED_IDS[@]} > 0 )); then
            echo "::error::published release(s) ${PUBLISHED_IDS[*]} already exist for v${VERSION}; refusing destructive rerun"
            exit 1
          fi

          for EXISTING_ID in "${DRAFT_IDS[@]}"; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/${EXISTING_ID}" >/dev/null
            echo "deleted stale draft ${EXISTING_ID} for v${VERSION} (will create fresh)"
          done
      # Dry-run is build-only. Never let the action find a published tag and
      # update that release back to draft.
      - name: Create GitHub Release (draft)
        id: create_release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          # For a manual dispatch with no pre-existing tag, create it at the
          # exact checkout SHA rather than GitHub's default branch head.
          target_commitish: ${{ github.sha }}
          draft: true
          # The version gate permits only stable or canonical beta.N, so a
          # suffix here unambiguously means beta. Deriving from workflow input
          # would be empty on tag-push and could publish a beta feed to a
          # non-prerelease release — which stable clients would then treat as
          # the latest and 404 on latest.yml.
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
          body_path: /tmp/release-body.md
          name: dsh-chamber v${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Release-path validation gate (2026 review): the tag push runs ci.yml and
  # release.yml in PARALLEL, so the release must validate itself — finalize
  # must never publish an untested commit. Mirrors ci.yml's test job core.
  validation:
    runs-on: ubuntu-latest
    # `actions: read` is for the CI proof below: it lists workflow runs/jobs
    # through the API with the runner's own read-only token — never a release
    # credential, so the dry-run scrub contract is untouched.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Pinned harness source tree is a git submodule (gitlink ==
          # harness.commit); the gitlink pins an exact commit, so the submodule is
          # materialized at that commit regardless of depth.
          submodules: true
      # Release CI proof (2026-09 CI-trigger revision): tag pushes no longer
      # re-run ci.yml — the release must PROVE its commit already passed the full
      # chain on main, including the windows leg release.yml has no equivalent of.
      # It needs only this checked-out script (no node_modules), so it stays
      # before the install: a commit main never validated fails immediately, one
      # still in flight is waited for (bounded).
      - name: Release commit passed CI on main (linux + windows legs)
        env:
          RELEASE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/verify-release-ci-proof.mjs --sha "$RELEASE_SHA"
      - name: Verify workflow action pins
        run: node scripts/gates/verify-workflow-action-pins.mjs
      - name: Verify workflow YAML scalars
        run: node scripts/gates/verify-workflow-yaml-scalars.mjs
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Bootstrap vendor tree (verify pin + ensure links)
        run: node scripts/dev/ensure-harness-vendor.mjs
      # Upstream-touchpoint registry gates (docs/checklists/upstream-touchpoints.md),
      # exactly as ci.yml runs them — in TWO passes, both required:
      #   1. here, before the install: C1/C3–C15 are file-only, so a drift fails
      #      fast without node_modules (`--no-artifact-rebuild` = C8 mtime
      #      advisory, and nothing is written);
      #   2. below, after the install: the default mode re-runs everything AND
      #      executes C8 (rebuild the committed host/mobile/dsh-runtime bundles
      #      and byte-compare, hard failure, then restore). C8 is the gate most
      #      easily defeated by "edited src, forgot to rebuild the artifact", so
      #      a release must never be the first place it runs (2026-12 review P2).
      - name: Upstream touchpoint registry (C1/C3/C4/C5/C6/C7/C9/C10 + C11–C15)
        run: node scripts/upstream/verify-upstream-touchpoints.mjs --no-artifact-rebuild
      - run: pnpm install --frozen-lockfile
      # C8 deterministic artifact gate (see the step above): rebuilds in place,
      # byte-compares, restores. Needs node_modules/esbuild, hence post-install.
      - name: Committed artifacts match sources (C8 rebuild gate)
        run: node scripts/upstream/verify-upstream-touchpoints.mjs
      - name: Assert lockfile not rewritten
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Type check (tsc + chamber host packages + gateway + runtime)
        run: |
          pnpm run typecheck
          pnpm run typecheck:host-graph
          pnpm run typecheck:host-git
          pnpm run typecheck:host-archive-cleanup
          pnpm run typecheck:host-open-in
          pnpm run typecheck:gateway
          pnpm run typecheck:runtime
      - name: i18n pair consistency
        run: pnpm run verify:i18n
      # File-only gates the push path runs (ci.yml) and the docs call
      # CI-backed: every *.test.ts / *.test.mjs must be reachable from a script,
      # and every relative markdown link must resolve. Same commands as ci.yml —
      # the release-workflow policy derives that alignment from ci.yml.
      - name: Test wiring gate
        run: pnpm run verify:test-wiring
      - name: Markdown link gate
        run: pnpm run verify:md-links
      # Upstream design-token conformance (S1–S7) — same gate as ci.yml's push
      # path; needs the bootstrapped vendor tree above (2026-12 review P2: the
      # release validation job silently omitted it).
      - name: Upstream design-token conformance (S1–S7)
        run: pnpm run verify:styles
      - name: Release workflow safety policy
        run: pnpm run test:release-workflow
      # Action-pin resolution over the network (release-preflight --actions-only):
      # the file-only pin check above cannot see a pin that points at a
      # non-existent upstream commit. GITHUB_TOKEN here is the runner's own
      # read-only token, used only to stay clear of anonymous API rate limits —
      # it is not a release credential, so the dry-run scrub contract (no
      # signing/npm/GH_TOKEN material) is untouched. Without it the check still
      # works against the anonymous limit.
      - name: Workflow action pins resolve upstream (release-preflight --actions-only)
        run: node scripts/release/release-preflight.mjs --actions-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Upgrade tooling (pin preflight classification / lockfile vendor-record
      # restore guard / upstream-gate CLI argument guard) — same gate as ci.yml.
      - name: Dev tooling unit tests (CI change classifier included)
        run: pnpm run test:upgrade-tools
      # The GUI acceptance toolbox's pure judgement layer (the driving layer
      # needs a display, so it stays a local gate — see
      # docs/checklists/gui-acceptance-checklist.md).
      - name: GUI acceptance toolbox unit tests
        run: pnpm run test:gui-acceptance
      # Same single entries the push path runs (2026-12): the package test set and
      # the client typecheck set are named once in scripts/gates/run-checks.mjs, so
      # `pnpm run test:release-workflow` proves validation and ci.yml cannot drift
      # from each other by comparing these two commands.
      - name: Package unit tests (single entry)
        run: node scripts/gates/run-checks.mjs tests
      - name: Client plugin type checks (single entry)
        run: node scripts/gates/run-checks.mjs typecheck
      # Shared runtime core build: the gateway tarball packs it, so a broken
      # runtime build must fail here rather than inside the packaging leg.
      - name: Shared runtime core build (gateway tarball prerequisite)
        run: pnpm run build:dsh-runtime
      - name: Renderer + host package builds
        run: |
          pnpm run build:renderer
          pnpm run build:host-packages
      # Desktop packaging sub-steps — ci.yml's "Desktop build sub-steps" gate
      # (2026-12 review P2: a release must not be the first place a broken
      # control-plane/preload/host-package build surfaces).
      - name: Desktop build sub-steps
        run: |
          pnpm --filter @dsh-chamber/desktop run build:control-plane
          pnpm --filter @dsh-chamber/desktop run build:preload
          pnpm --filter @dsh-chamber/desktop run build:host-graph-package
      # Third-party notices must track the installed dependency set; a stale
      # committed file blocks the release (ci.yml's "Third-party notices
      # current"). Regenerating alone is not a gate — the diff assertion is.
      - name: Third-party notices current
        run: node scripts/release/gen-third-party-notices.mjs && git diff --exit-code -- THIRD_PARTY_NOTICES.md docs/THIRD_PARTY_NOTICES.en-US.md


  build-gateway:
    # Gateway is distributed in this release only as a GitHub Release tarball
    # plus SHA256. Runs in PARALLEL with the desktop build legs (2026-09
    # decision): it packs from the same tag-bound SHA (S16) and downloads no
    # desktop artifact, so nothing serializes on the platform legs. Public
    # atomicity is enforced by finalize-release, which needs every build leg
    # (gateway + macos + windows + linux) before flipping the draft public —
    # a failed leg keeps the release private, and the next run's create-release
    # stale-draft replacement clears any orphan assets. npm publication is
    # deliberately out of scope and has no dormant workflow step here.
    needs: [create-release, validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Artifacts must be built from the exact SHA the create-release job
          # bound the tag to; a default-branch advance between jobs must not
          # pack/publish an unvalidated commit under a validated tag (S16).
          ref: ${{ github.sha }}
          # Pinned harness source tree is a git submodule (gitlink ==
          # harness.commit); shallow keeps the multi-hundred-package monorepo fast.
          submodules: true
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Bootstrap vendor tree (verify pin + ensure links)
        run: node scripts/dev/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile
      - name: Assert lockfile not rewritten
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Pack and smoke-test the installed gateway CLI
        run: |
          mkdir -p packages/gateway/release /tmp/dsh-gateway-install
          pnpm --filter @dsh-chamber/gateway pack --pack-destination packages/gateway/release
          npm install --ignore-scripts --prefix /tmp/dsh-gateway-install packages/gateway/release/*.tgz
          /tmp/dsh-gateway-install/node_modules/.bin/gateway --help
      - name: Assert the packed gateway tarball carries the bundled pnpm
        # The installer local (default) path unpacks the tarball and never
        # installs gateway dependencies — dist/pnpm IS the runtime pnpm there
        # (design 18 §9.2 D1; scripts/build.mjs bundles it). A pack missing it
        # would boot with "Cannot find module 'pnpm'" on every local install.
        run: |
          set -euo pipefail
          TGZ=$(find packages/gateway/release -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$TGZ"
          # No grep -q here: under `set -o pipefail` on GNU tar (Linux
          # runner), grep -q exits at the first match, closes the pipe early
          # and tar dies with "stdout: write error" (exit 2) — a false
          # failure on a HEALTHY tarball. Read the whole listing and
          # discard output instead; a missing entry still fails (grep 1).
          tar -tzf "$TGZ" | grep 'package/dist/pnpm/bin/pnpm.cjs' >/dev/null
      - name: Smoke the bundled pnpm from a bare unpack (installer local shape, no npm install)
        run: |
          set -euo pipefail
          TGZ=$(find packages/gateway/release -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$TGZ"
          rm -rf /tmp/dsh-gateway-bare
          mkdir -p /tmp/dsh-gateway-bare
          tar --strip-components=1 -xzf "$TGZ" -C /tmp/dsh-gateway-bare
          node /tmp/dsh-gateway-bare/dist/pnpm/bin/pnpm.cjs --version
      - name: Write gateway package sha256 (installer verification asset)
        run: |
          set -euo pipefail
          TGZ=$(find packages/gateway/release -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$TGZ"
          cd packages/gateway/release
          sha256sum "$(basename "$TGZ")" > "$(basename "$TGZ").sha256"
          cat "$(basename "$TGZ").sha256"
      - name: Upload gateway package to the draft release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: true
          files: |
            packages/gateway/release/*.tgz
            packages/gateway/release/*.tgz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-macos:
    needs: [create-release, validation]
    permissions:
      contents: write
    # Public arm64 runner label only (OpenChamber 踩坑：非公开标签
    # macos-26 / macos-15-intel 会找不到 runner 而失败)。v1 ships arm64 only:
    # macos-13, the last public x64 runner, is retired; macos-14 is deprecated
    # (2026-07) and fully unsupported by 2026-11, so the mac leg builds on
    # macos-latest (= macOS 26, arm64; 2026-08 v0.1.2 按 macOS 26 发布的
    # 决定)。bundle:dsh bakes the host platform's dsh runtime, so x64 cannot
    # be cross-built on an arm64 runner without Rosetta toolchain work
    # (deferred, see STATUS.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Build from the exact SHA the create-release job bound the tag to
          # (S16): a branch advance between jobs must not ship an unvalidated
          # commit under a validated tag.
          ref: ${{ github.sha }}
          # Pinned harness source tree is a git submodule (gitlink ==
          # harness.commit); shallow keeps the multi-hundred-package monorepo fast.
          submodules: true
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Bootstrap vendor tree (verify pin + ensure links)
        run: node scripts/dev/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile
      - name: Assert lockfile not rewritten
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Build and package macOS app (arm64)
        # electron-builder runs the afterPack hook
        # (packages/desktop/scripts/after-pack-adhoc-sign.mjs), which ad-hoc
        # signs the bundle first; when the Apple secrets below are present it
        # then replaces that with a Developer ID signature and notarizes
        # (mac.notarize=true reads APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/
        # APPLE_TEAM_ID). publish=always (unless dry_run) uploads every
        # artifact into the draft release created above — INCLUDING the update
        # feed (zip + exactly one of latest-mac.yml / beta-mac.yml) that electron-updater
        # consumes (design 11 §6): update-info files are only generated when a
        # publish policy other than "never" is active.
        run: |
          # A dry run is always ad-hoc and mutation-free even when repository
          # secrets exist: strip every signing/notarization/upload credential
          # before electron-builder starts. Formal releases keep the fail-closed
          # credential gate in create-release and use Developer ID + notarization.
          if [[ "$DRY_RUN" == "true" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD CSC_KEYCHAIN APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID GH_TOKEN
          else
            # electron-builder's chooseNotNull treats "" as present, so omit
            # empty values rather than passing an invalid credential.
            if [[ -z "$CSC_LINK" ]]; then unset CSC_LINK; fi
            if [[ -z "$CSC_KEY_PASSWORD" ]]; then unset CSC_KEY_PASSWORD; fi
            if [[ -z "$APPLE_ID" ]]; then unset APPLE_ID; fi
            if [[ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then unset APPLE_APP_SPECIFIC_PASSWORD; fi
            if [[ -z "$APPLE_TEAM_ID" ]]; then unset APPLE_TEAM_ID; fi

            # --- Developer ID signing keychain bootstrap (2026-09-05 fix) ---
            # electron-builder 26.15.3's CSC_LINK path (macCodeSign.js
            # createKeychain/importCerts) creates its temp keychain with a
            # RANDOM password yet calls `security set-key-partition-list
            # -k <p12 password>` against it — a password mismatch by
            # construction that older macOS tolerated on an already-unlocked
            # keychain. The macOS 26.6 hosted image (Darwin 25.6, rolled
            # 2026-09-05) now validates -k against the real keychain password
            # and fails the whole mac leg with "SecKeychainUnlock: passphrase
            # incorrect" (v0.2.2 formal run). Fix: provision the keychain
            # HERE with one consistent password, then run electron-builder
            # WITHOUT CSC_LINK so it skips its temp-keychain path and signs
            # with the pre-provisioned keychain via CSC_KEYCHAIN (macPackager:
            # `keychainFile: process.env.CSC_KEYCHAIN || null`; identity is
            # the single imported Developer ID certificate).
            KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
            KEYCHAIN_FILE="$RUNNER_TEMP/dsh-chamber-signing.keychain"
            P12_FILE="$RUNNER_TEMP/dsh-chamber-cert.p12"
            # CSC_LINK mirrors electron-builder's importCertificate handling:
            # https URL → download; base64 (data: prefix / long / trailing
            # '=') → decode; else file path (file:// stripped).
            TRIMMED_LINK="$(printf '%s' "$CSC_LINK" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [[ "$TRIMMED_LINK" == https://* ]]; then
              curl -fsSL "$TRIMMED_LINK" -o "$P12_FILE"
            else
              B64_ARG=""
              if [[ "$TRIMMED_LINK" == data:*base64,* ]]; then
                B64_ARG="${TRIMMED_LINK#*,}"
              elif (( ${#TRIMMED_LINK} > 2048 )) || [[ "$TRIMMED_LINK" == *= ]]; then
                B64_ARG="$TRIMMED_LINK"
              fi
              if [[ -n "$B64_ARG" ]]; then
                printf '%s' "$B64_ARG" | base64 --decode > "$P12_FILE"
              else
                [[ "$TRIMMED_LINK" != file://* ]] || TRIMMED_LINK="${TRIMMED_LINK#file://}"
                cp "$TRIMMED_LINK" "$P12_FILE"
              fi
            fi
            test -s "$P12_FILE"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
            # 6h auto-lock timeout: signing happens minutes later, after
            # build:desktop — a re-locked keychain would fail codesign.
            security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
            security import "$P12_FILE" -k "$KEYCHAIN_FILE" -P "$CSC_KEY_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            # -k must be the KEYCHAIN's own password (the p12 password would
            # be wrong here — exactly electron-builder's bug).
            security set-key-partition-list -S apple-tool:,apple: -s \
              -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
            security list-keychains -d user -s "$KEYCHAIN_FILE" \
              $(security list-keychains -d user | tr -d '"')
            rm -f "$P12_FILE"
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_KEYCHAIN="$KEYCHAIN_FILE"
          fi
          pnpm run build:desktop
          BUILDER_CONFIG=()
          if [[ "$VERSION" == *-* ]]; then
            BUILDER_CONFIG=(--config electron-builder.beta.yml)
          fi
          # Re-unlock right before signing: the keychain must be unlocked
          # (and in the search list) when electron-builder resolves the
          # identity from CSC_KEYCHAIN.
          if [[ -n "${CSC_KEYCHAIN:-}" && -n "${KEYCHAIN_PASSWORD:-}" ]]; then
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          fi
          pnpm --filter @dsh-chamber/desktop exec electron-builder --mac --arm64 "${BUILDER_CONFIG[@]}" --publish=${{ github.event.inputs.dry_run == 'true' && 'never' || 'always' }}
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS app — Developer ID + notarization (fail-closed on release)
        # Structural checks run for every build (ad-hoc dry runs included): the
        # .app bundle exists, its signature verifies, and the darwin dsh
        # runtime is baked in (extraResources vendor). A REAL release
        # (dry_run != true) additionally FAILS CLOSED unless the .app carries a
        # Developer ID signature, a stapled notarization ticket, and Gatekeeper
        # accepts it — missing/misconfigured secrets fail this job, which (via
        # the finalize `needs`) keeps the draft unpublished. The update feed
        # (zip + channel yml) must also exist when not dry-running.
        run: |
          set -euo pipefail
          # G36：按 release-artifacts 的精确产物名验证（不再 find|head / glob ——
          # 复用工作目录时旧归档可以满足验证而新产物已坏）。
          BASE="packages/desktop/release/dsh-chamber-${VERSION}-arm64"
          APP_DIR="packages/desktop/release/mac-arm64/dsh-chamber.app"
          test -d "$APP_DIR"
          echo "app bundle: $APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          RUNTIME="$APP_DIR/Contents/Resources/vendor/dsh"
          test -f "$RUNTIME/node_modules/@deepseek-ai/dsh/package.json"
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('$RUNTIME/package.json','utf8'));if(!p.dsh?.platform?.startsWith('darwin-')){throw new Error('wrong bundled dsh platform: '+p.dsh?.platform)};console.log('bundled dsh: '+(p.dependencies?.['@deepseek-ai/dsh']??'?')+' ('+p.dsh.platform+')')"
          test -f "${BASE}.dmg"
          if [[ "${{ github.event.inputs.dry_run }}" != "true" ]]; then
            codesign -dv --verbose=4 "$APP_DIR" 2>&1 | tee /tmp/codesign-dv.txt
            grep -q 'Authority=Developer ID' /tmp/codesign-dv.txt
            xcrun stapler validate "$APP_DIR"
            spctl --assess --type execute --verbose=4 "$APP_DIR"
            test -f "${BASE}-mac.zip"
            if [[ "$VERSION" == *-* ]]; then
              test -f packages/desktop/release/beta-mac.yml
              test ! -e packages/desktop/release/latest-mac.yml
            else
              test -f packages/desktop/release/latest-mac.yml
              test ! -e packages/desktop/release/beta-mac.yml
            fi
          fi
        env:
          VERSION: ${{ needs.create-release.outputs.version }}

      - name: Notarize + staple the Electron dmg (release only)
        # S-31：electron-builder 的 mac.notarize=true 只覆盖 appPath（.app），
        # dmg-builder 不会提交/装订 dmg 本体——离线或默认 Gatekeeper 打开挂载卷
        # 仍可能报未公证。这里复用同一组 Apple 凭据对 dmg 本体提交 notarytool、
        # staple 装订并用 stapler/spctl 校验。构建步的 electron-builder publish
        # 已把未装订的 dmg 传进 draft，因此装订后必须 --clobber 重传同名资产。
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          BASE="packages/desktop/release/dsh-chamber-${VERSION}-arm64"
          DMG="${BASE}.dmg"
          test -f "$DMG" || { echo "::error::missing $DMG (the mac leg produced no exact-named dmg)"; exit 1; }
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          gh release upload "v${VERSION}" "$DMG" --clobber
          echo "dmg notarized + stapled + re-uploaded: $DMG"

      - name: Verify mac zip contents — extract and re-verify the uploaded app (G28)
        # G28：上传物只验 staging .app 不够（旧实现对 zip 只有 test -n）——解出
        # zip 内的 .app 再跑 codesign/架构；正式腿加 Developer ID/票据/Gatekeeper
        # 复核，与 Swift 腿的 P4(b) 同一纪律。dry run 也解包验结构（ad-hoc 可过）。
        run: |
          set -euo pipefail
          BASE="packages/desktop/release/dsh-chamber-${VERSION}-arm64"
          ZIP="${BASE}-mac.zip"
          test -f "$ZIP" || { echo "::error::missing $ZIP (the mac leg produced no exact-named zip)"; exit 1; }
          EXTRACT="$RUNNER_TEMP/dsh-chamber-electron-zip-verify"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          ditto -x -k "$ZIP" "$EXTRACT"
          ZIP_APP=""
          for candidate in "$EXTRACT"/*.app; do
            if [[ -d "$candidate" ]]; then ZIP_APP="$candidate"; break; fi
          done
          test -n "$ZIP_APP" || { echo "::error::no .app at the root of $ZIP"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$ZIP_APP"
          if [[ "${{ github.event.inputs.dry_run }}" != "true" ]]; then
            codesign -dv --verbose=4 "$ZIP_APP" 2>&1 | tee /tmp/electron-zip-codesign-dv.txt
            grep -q 'Authority=Developer ID' /tmp/electron-zip-codesign-dv.txt
            xcrun stapler validate "$ZIP_APP"
            spctl --assess --type execute --verbose=4 "$ZIP_APP"
          fi
          echo "zip content verified: $ZIP -> $ZIP_APP"
        env:
          VERSION: ${{ needs.create-release.outputs.version }}

  build-windows:
    needs: [create-release, validation]
    permissions:
      contents: write
    # windows-2022, not windows-latest: the node-gyp stack does not detect the
    # VS 18 toolchain that windows-latest ships (same finding as OpenChamber).
    # x64 only — bundle:dsh bakes native modules (node-pty etc.) for the host
    # platform; arm64 would need an arm64 runner, not cross-compilation.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Build from the exact SHA the create-release job bound the tag to
          # (S16): a branch advance between jobs must not ship an unvalidated
          # commit under a validated tag.
          ref: ${{ github.sha }}
          # Pinned harness source tree is a git submodule (gitlink ==
          # harness.commit); shallow keeps the multi-hundred-package monorepo fast.
          submodules: true
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Bootstrap vendor tree (verify pin + ensure links)
        run: node scripts/dev/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile
      - name: Assert lockfile not rewritten
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Build and package Windows app
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then unset GH_TOKEN; fi
          pnpm run build:desktop
          BUILDER_CONFIG=()
          if [[ "$VERSION" == *-* ]]; then
            BUILDER_CONFIG=(--config electron-builder.beta.yml)
          fi
          pnpm --filter @dsh-chamber/desktop exec electron-builder --win --x64 "${BUILDER_CONFIG[@]}" --publish=${{ github.event.inputs.dry_run == 'true' && 'never' || 'always' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}

      - name: Verify packaged Windows app (OpenChamber-style, unsigned)
        # Assert the runner is win32-x64 (bundle:dsh bakes the host platform)
        # and that the win32 dsh runtime made it into the unpacked app. When
        # not dry-running, also assert the UPDATE FEED (design 11 §6): the
        # channel yml electron-updater consumes. NO .blockmap is expected
        # (2026-08: differentialPackage=false — the feed never references a
        # blockmap, updates fall back to full downloads).
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform + "-" + process.arch')" = "win32-x64"
          test -d packages/desktop/release/win-unpacked
          RUNTIME=packages/desktop/release/win-unpacked/resources/vendor/dsh
          test -f "$RUNTIME/node_modules/@deepseek-ai/dsh/package.json"
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('$RUNTIME/package.json','utf8'));if(!p.dsh?.platform?.startsWith('win32-')){throw new Error('wrong bundled dsh platform: '+p.dsh?.platform)};console.log('bundled dsh: '+(p.dependencies?.['@deepseek-ai/dsh']??'?')+' ('+p.dsh.platform+')')"
          test -n "$(ls packages/desktop/release/*.exe 2>/dev/null | head -n 1)"
          if [[ "${{ github.event.inputs.dry_run }}" != "true" ]]; then
            test -z "$(ls packages/desktop/release/*.blockmap 2>/dev/null | head -n 1)"
            if [[ "$VERSION" == *-* ]]; then
              test -f packages/desktop/release/beta.yml
              test ! -e packages/desktop/release/latest.yml
            else
              test -f packages/desktop/release/latest.yml
              test ! -e packages/desktop/release/beta.yml
            fi
          fi
        env:
          VERSION: ${{ needs.create-release.outputs.version }}

  build-linux:
    needs: [create-release, validation]
    permissions:
      contents: write
    # ubuntu-22.04, not ubuntu-latest: the AppImage's glibc floor equals the
    # BUILD runner's (2.35 on 22.04) — building on 24.04 would exclude every
    # 22.04-era desktop (design 21, Linux desktop support). x64 only for now —
    # bundle:dsh bakes native modules for the host platform; arm64 needs a
    # native arm runner leg (deferred, mirror OpenChamber's per-arch matrix).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Build from the exact SHA the create-release job bound the tag to
          # (S16): a branch advance between jobs must not ship an unvalidated
          # commit under a validated tag.
          ref: ${{ github.sha }}
          # Pinned harness source tree is a git submodule (gitlink ==
          # harness.commit); shallow keeps the multi-hundred-package monorepo fast.
          submodules: true
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Bootstrap vendor tree (verify pin + ensure links)
        run: node scripts/dev/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile
      - name: Assert lockfile not rewritten
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Build and package Linux AppImage
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then unset GH_TOKEN; fi
          pnpm run build:desktop
          BUILDER_CONFIG=()
          if [[ "$VERSION" == *-* ]]; then
            BUILDER_CONFIG=(--config electron-builder.beta.yml)
          fi
          pnpm --filter @dsh-chamber/desktop exec electron-builder --linux --x64 "${BUILDER_CONFIG[@]}" --publish=${{ github.event.inputs.dry_run == 'true' && 'never' || 'always' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}

      - name: Verify packaged Linux AppImage (OpenChamber-style)
        # Assert the runner is linux-x64 (bundle:dsh bakes the host platform)
        # and that the linux dsh runtime made it into the unpacked app. When
        # not dry-running, also assert the UPDATE FEED (design 11 §6 / 21):
        # electron-updater consumes latest-linux.yml / beta-linux.yml on
        # linux-x64. NO .blockmap is expected (AppImage ships none; the feed
        # never references one — updates fall back to full downloads).
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform + "-" + process.arch')" = "linux-x64"
          test -d packages/desktop/release/linux-unpacked
          RUNTIME=packages/desktop/release/linux-unpacked/resources/vendor/dsh
          test -f "$RUNTIME/node_modules/@deepseek-ai/dsh/package.json"
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('$RUNTIME/package.json','utf8'));if(!p.dsh?.platform?.startsWith('linux-')){throw new Error('wrong bundled dsh platform: '+p.dsh?.platform)};console.log('bundled dsh: '+(p.dependencies?.['@deepseek-ai/dsh']??'?')+' ('+p.dsh.platform+')')"
          test -n "$(ls packages/desktop/release/*.AppImage 2>/dev/null | head -n 1)"
          if [[ "${{ github.event.inputs.dry_run }}" != "true" ]]; then
            test -z "$(ls packages/desktop/release/*.blockmap 2>/dev/null | head -n 1)"
            if [[ "$VERSION" == *-* ]]; then
              test -f packages/desktop/release/beta-linux.yml
              test ! -e packages/desktop/release/latest-linux.yml
            else
              test -f packages/desktop/release/latest-linux.yml
              test ! -e packages/desktop/release/beta-linux.yml
            fi
          fi
        env:
          VERSION: ${{ needs.create-release.outputs.version }}

  # Swift 原生壳产物腿（design 25 §8.4 / W-26）：与 Electron mac 腿同 tag 并行，
  # 产物名带 -native 防碰撞。dry-run 走 ad-hoc 且不发布（与 build-macos 同纪律：
  # 剥离一切签名/公证/上传凭据）；正式腿 fail-closed——CSC_LINK 已在
  # create-release 前置门校验，本腿导入同一 p12 并解析 Developer ID 身份，
  # 缺失即失败（finalize 的 needs 因此挡住发布）。Apple 凭据类外部阻断登记在
  # STATUS（A6）。
  build-swift:
    needs: [create-release, validation]
    permissions:
      contents: write
    runs-on: macos-latest
    # S-22：beta appcast 的滚动 release tag（单一定义，构建步与 appcast 步共用）。
    # **不以 v 开头**——release.yml 的 tag 触发是 `v*`，滚动 tag 绝不能触发一次
    # 发布运行；tag/release 缺失时由 appcast 步幂等创建（并标 prerelease，绝不
    # 影响 releases/latest 的稳定通道）。
    env:
      SPARKLE_BETA_ROLLING_TAG: appcast-swift-beta
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          submodules: true
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Bootstrap vendor tree (verify pin + ensure links)
        run: node scripts/dev/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile
      - name: Assert lockfile not rewritten
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Build sidecar assembly + native .app
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID GH_TOKEN
            IDENTITY="-"
            echo "dry run: ad-hoc signature, no notarization, no upload"
          else
            test -n "${CSC_LINK:-}" || { echo "::error::formal Swift release requires CSC_LINK"; exit 1; }
            KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
            KEYCHAIN_FILE="$RUNNER_TEMP/dsh-chamber-swift-signing.keychain"
            P12_FILE="$RUNNER_TEMP/dsh-chamber-swift-cert.p12"
            TRIMMED_LINK="$(printf '%s' "$CSC_LINK" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [[ "$TRIMMED_LINK" == https://* ]]; then
              curl -fsSL "$TRIMMED_LINK" -o "$P12_FILE"
            else
              B64_ARG=""
              if [[ "$TRIMMED_LINK" == data:*base64,* ]]; then
                B64_ARG="${TRIMMED_LINK#*,}"
              elif (( ${#TRIMMED_LINK} > 2048 )) || [[ "$TRIMMED_LINK" == *= ]]; then
                B64_ARG="$TRIMMED_LINK"
              fi
              if [[ -n "$B64_ARG" ]]; then
                printf '%s' "$B64_ARG" | base64 --decode > "$P12_FILE"
              else
                [[ "$TRIMMED_LINK" != file://* ]] || TRIMMED_LINK="${TRIMMED_LINK#file://}"
                cp "$TRIMMED_LINK" "$P12_FILE"
              fi
            fi
            test -s "$P12_FILE"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
            security import "$P12_FILE" -k "$KEYCHAIN_FILE" -P "$CSC_KEY_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s \
              -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
            security list-keychains -d user -s "$KEYCHAIN_FILE" \
              $(security list-keychains -d user | tr -d '"')
            rm -f "$P12_FILE"
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_FILE" \
              | awk '/Developer ID Application/ {print $2; exit}')"
            test -n "$IDENTITY" || { echo "::error::no Developer ID Application identity in CSC_LINK"; exit 1; }
            echo "signing identity: $IDENTITY"
            export KEYCHAIN_PASSWORD KEYCHAIN_FILE
          fi
          pnpm run build:host-packages
          pnpm run build:renderer
          pnpm --filter @dsh-chamber/desktop run build:control-plane
          # 内置 dsh 工作区必须先物化（.gitignore 只提交 vendor/dsh/pnpm-lock.yaml，
          # package.json + node_modules 由 bundle-dsh.mjs 生成；否则 build-sidecar
          # 只 warn、下面 verify 的 test -f 直接失败——2026-09 模块评审 major）。
          pnpm --filter @dsh-chamber/desktop run bundle:dsh
          # W-23：真实 Node 捆绑（官方 tar.gz + SHA-256 校验；命名必须是 node）。
          pnpm run build:sidecar
          if [[ -n "${KEYCHAIN_FILE:-}" ]]; then
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          fi
          # 正式腿先只组装+签名 .app（--no-zip --no-dmg）：归档必须在公证与
          # stapler 装订**之后**生成，否则上传的 zip/dmg 内 .app 没有票据
          # （2026-09 审计 major：原顺序先打包后公证，离线 Gatekeeper 必失败）。
          ARTIFACT_ARGS=()
          if [[ "$DRY_RUN" != "true" ]]; then
            ARTIFACT_ARGS=(--no-zip --no-dmg)
          fi
          # 原生壳的应用内更新（S-01 / 裁决 D-1 选 B）：公钥存在才把 feed 与公钥注入
          # Info.plist（壳据此点亮「检查更新…」并向 sidecar 声明安装腿）；缺失 = 该
          # 构建的自动更新保持关闭（照常出包，只是没有安装腿）。
          # S-22：feed 随通道选择。稳定版用 releases/latest（只解析非 prerelease）；
          # beta 是 GitHub prerelease，/releases/latest 恒指不到它，因此 beta 指向
          # **滚动 tag** ${SPARKLE_BETA_ROLLING_TAG} 上的同名 asset（appcast 步每次
          # beta 覆盖它）——版本固定 URL（releases/download/v<ver>/…）会让 beta.N
          # 永远发现不了 beta.N+1。稳定 URL 保持不变。
          # S-36：appcast 与它 enclosure 引用的 zip 都落在同一个滚动 release 上
          # （appcast 步用 --download-url-prefix 钉住该 release，verify 后先传 zip
          # 再传 appcast），beta 客户端的下载因此不会 404。
          SPARKLE_FEED_STABLE="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast-swift.xml"
          SPARKLE_FEED_BETA="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SPARKLE_BETA_ROLLING_TAG}/appcast-swift-beta.xml"
          if [[ "$VERSION" == *-* ]]; then
            SPARKLE_FEED="$SPARKLE_FEED_BETA"
          else
            SPARKLE_FEED="$SPARKLE_FEED_STABLE"
          fi
          SPARKLE_ARGS=()
          if [[ -n "${SPARKLE_PUBLIC_ED_KEY:-}" ]]; then
            SPARKLE_ARGS=(--sparkle-feed "$SPARKLE_FEED" --sparkle-public-key "$SPARKLE_PUBLIC_ED_KEY")
            echo "Sparkle auto-update wired (feed=$SPARKLE_FEED)"
          else
            echo "::warning::SPARKLE_PUBLIC_ED_KEY absent — native auto-update stays disabled in this build"
          fi
          pnpm run build:swift-app --out macos/release \
            --app-name dsh-chamber-native \
            --artifact-basename "dsh-chamber-native-${VERSION}-macos-arm64" \
            --identity "$IDENTITY" ${SPARKLE_ARGS[@]+"${SPARKLE_ARGS[@]}"} ${ARTIFACT_ARGS[@]+"${ARTIFACT_ARGS[@]}"}
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize + staple native app and dmg (release only)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          APP="macos/release/dsh-chamber-native.app"
          BASE="macos/release/dsh-chamber-native-${VERSION}-macos-arm64"
          test -d "$APP"
          # 提交用临时 zip（公证接受 zip/dmg/pkg）；票据装订到 .app 后才生成
          # 最终分发归档，保证上传物内的 .app 已 stapled。
          SUBMIT_ZIP="$RUNNER_TEMP/dsh-chamber-native-notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$SUBMIT_ZIP"
          xcrun notarytool submit "$SUBMIT_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          rm -f "$SUBMIT_ZIP" "${BASE}.zip" "${BASE}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "${BASE}.zip"
          # P7：DMG 卷 = .app + /Applications 快捷方式（Finder 拖拽安装惯例），
          # 且 DMG 本体也要公证+装订——只装订 .app 时离线 Gatekeeper 对挂载卷
          # 仍报未公证。
          DMG_STAGE="$RUNNER_TEMP/dsh-chamber-native-dmg"
          rm -rf "$DMG_STAGE"
          mkdir -p "$DMG_STAGE"
          ditto "$APP" "$DMG_STAGE/dsh-chamber-native.app"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname dsh-chamber-native -srcfolder "$DMG_STAGE" \
            -ov -format UDZO "${BASE}.dmg"
          xcrun notarytool submit "${BASE}.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${BASE}.dmg"
          xcrun stapler validate "${BASE}.dmg"
          xcrun stapler validate "$APP"

      - name: Generate + sign the Sparkle appcast (release only)
        # S-01 / 裁决 D-1 选 B + S-22 + G16：原生壳的更新源是随 release 上传的
        # appcast（稳定通道 appcast-swift.xml；beta 通道 appcast-swift-beta.xml），
        # 由 Sparkle 的 generate_appcast 用 EdDSA 私钥签名（与 Developer ID 无关的
        # 第三把钥匙，客户端据此校验更新包来源）。私钥缺失 → loud 跳过（照常发布，
        # 只是原生壳看不到这次更新），绝不发布未签名 appcast。
        # S-36：beta 的 enclosure 必须真实可下载——每个被 appcast 引用的 zip 都随
        # appcast 上传到滚动 release（zip 在前，appcast 在后），前缀显式钉住滚动
        # tag；S-22/S-23：beta appcast 同时收最新 final 的 native zip 条目，beta
        # 客户端因此能看到 final（与 Electron latest.yml 回退同一可见性）。
        # stable 通道不传前缀——appcast-swift.xml 与 enclosure 形状逐字节不变；
        # S-23 的滚动 beta appcast 刷新在 verify 之后（下一步），本步绝不改写
        # stable appcast。
        # ORDER（G16）：必须在 notarize + staple 之后——签的是**最终分发 zip**
        # （上一步在装订后才生成 ${BASE}.zip）；旧顺序（appcast 在公证前）在正式
        # 腿会因 test -f 直接红，或签下未装订的残留 zip。
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ needs.create-release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE="macos/release/dsh-chamber-native-${VERSION}-macos-arm64"
          # S-22：beta 通道发布独立的 appcast，与构建步注入的 beta feed 同名；
          # beta 还要覆盖到滚动 tag/release（v* 之外的 tag，见 build-swift 的
          # job env），让 beta.N 客户端能发现 beta.N+1。
          if [[ "$VERSION" == *-* ]]; then
            APPCAST="appcast-swift-beta.xml"
            ROLLING_TAG="${SPARKLE_BETA_ROLLING_TAG}"
          else
            APPCAST="appcast-swift.xml"
            ROLLING_TAG=""
          fi
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "::warning::SPARKLE_PRIVATE_KEY absent — ${APPCAST} not generated; the native shell will not see this release through Sparkle"
            exit 0
          fi
          ZIP="${BASE}.zip"
          test -f "$ZIP" || { echo "::error::missing $ZIP (the appcast signs the final stapled release zip)"; exit 1; }
          curl -sSL -o /tmp/sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz"
          rm -rf /tmp/sparkle-bin && mkdir -p /tmp/sparkle-bin && tar -xJf /tmp/sparkle.tar.xz -C /tmp/sparkle-bin
          rm -rf /tmp/appcast-in /tmp/appcast-out && mkdir -p /tmp/appcast-in /tmp/appcast-out
          cp "$ZIP" /tmp/appcast-in/
          # S-22/S-23：beta appcast 必须同时收当前 beta 与**最新 final**——beta 客户端的
          # SUFeedURL 只指滚动 tag，只收 beta 条目就永远看不到 stable（Electron beta 经
          # latest.yml 回退能看到；原生腿补上同一可见性）。latest release 尚无 native zip
          # （首次 beta / stable 还没出过原生包）→ loud 降级为只收 beta，绝不算发布失败。
          if [[ -n "$ROLLING_TAG" ]]; then
            # 显式走 /releases/latest（与稳定 feed 同一解析面：绝不含 prerelease/draft），
            # 不用 gh 的隐式 latest——beta 必须是稳定的 final，绝不能把某个 prerelease
            # 当成 final 收进 appcast。
            STABLE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
            if [[ -n "$STABLE_TAG" ]] && gh release download "$STABLE_TAG" \
                 --repo "$GITHUB_REPOSITORY" \
                 --pattern 'dsh-chamber-native-*-macos-arm64.zip' \
                 --dir /tmp/appcast-in --clobber; then
              echo "beta appcast 收件目录：$(ls /tmp/appcast-in | tr '\n' ' ')"
            else
              echo "::warning::latest final release 没有可下载的 native zip——beta appcast 仅含当前 beta（beta 客户端暂时看不到 final）"
            fi
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/ed-key.txt
          # S-36：enclosure 必须真实可下载。generate_appcast 缺省把 enclosure 解析为
          # 「zip 文件名相对该 zip 内嵌 SUFeedURL」（ArchiveItem.archiveURL），beta zip
          # 内嵌的 feed 是滚动 tag ⇒ enclosure 落在滚动 release 上。这里再用
          # --download-url-prefix 显式钉住滚动 tag 下载目录（尾部斜杠是 URL(relativeTo:)
          # 语义要求），且下方把收件目录里每个 zip 都上传到该 release——enclosure 逐条可
          # 解析，stable 通道不传前缀、形状逐字节不变。
          PREFIX_ARGS=()
          if [[ -n "$ROLLING_TAG" ]]; then
            PREFIX_ARGS=(--download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROLLING_TAG}/")
          fi
          /tmp/sparkle-bin/bin/generate_appcast --ed-key-file /tmp/ed-key.txt ${PREFIX_ARGS[@]+"${PREFIX_ARGS[@]}"} -o /tmp/appcast-out /tmp/appcast-in
          rm -f /tmp/ed-key.txt
          test -f /tmp/appcast-out/appcast.xml || { echo "::error::generate_appcast produced no appcast"; exit 1; }
          cp /tmp/appcast-out/appcast.xml "macos/release/${APPCAST}"
          gh release upload "v${VERSION}" "macos/release/${APPCAST}" --clobber
          # S-22/S-36：beta 的**滚动发布**不在本步执行——rolling release 是公开面
          # （beta 客户端 SUFeedURL 指向它），发布挪到 verify 步之后（下一步
          # "Upload native artifacts"），未经 codesign/stapler/架构校验的归档绝不
          # 暴露给 beta 客户端；v${VERSION} 的本次上传落在 draft 上（finalize 前
          # 不可见）。本步只保证 /tmp/appcast-in（enclosure 引用集合）与 appcast
          # 文件就绪，供下一步按「归档 → appcast」顺序滚动发布。
          echo "${APPCAST} signed and uploaded to the draft release"

      - name: Verify native app + uploaded archives (fail-closed on release)
        run: |
          set -euo pipefail
          APP="macos/release/dsh-chamber-native.app"
          BASE="macos/release/dsh-chamber-native-${VERSION}-macos-arm64"
          DRY_RUN="${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # 装配面结构断言：sidecar 的 node 基名（A5）、sidecar 入口 + 装配
          # package.json、control-plane 相对入口、四个 host 包、打包 shim、
          # renderer dist（2026-12 P2：原清单漏了后三类，.app 少任何一个都能
          # 上传成功）。
          test -x "$APP/Contents/Resources/sidecar/node"
          test "$(basename "$APP/Contents/Resources/sidecar/node")" = "node"
          test -f "$APP/Contents/Resources/sidecar/sidecar.js"
          test -f "$APP/Contents/Resources/sidecar/package.json"
          test -f "$APP/Contents/Resources/sidecar/dist/control-plane/index.js"
          for HOST in dsh-chamber-seed-client-graph dsh-chamber-seed-git-worktree \
                      dsh-chamber-seed-archive-cleanup dsh-chamber-seed-open-in; do
            test -f "$APP/Contents/Resources/sidecar/dist/$HOST/dist/index.js"
          done
          test -f "$APP/Contents/Resources/DSHChamberPoc_DSHChamberPoc.bundle/bridge-shim.poc.js"
          test -f "$APP/Contents/Resources/dist/web/index.html"
          # 三审 #1/#2：打包态本地实例依赖内置 dsh 工作区与内嵌 pnpm。
          test -f "$APP/Contents/Resources/sidecar/vendor/dsh/package.json"
          test -f "$APP/Contents/Resources/sidecar/vendor/dsh/node_modules/.modules.yaml"
          test -f "$APP/Contents/Resources/sidecar/pnpm/bin/pnpm.cjs"
          # P4：架构断言——build-sidecar 缺省 darwin-arm64 而 swift build 跟随
          # 宿主；两者不一致的 .app 能签名打包、运行时才崩。
          APP_ARCHS="$(lipo -archs "$APP/Contents/MacOS/DSHChamberPoc")"
          NODE_ARCHS="$(lipo -archs "$APP/Contents/Resources/sidecar/node")"
          echo "archs: app=$APP_ARCHS node=$NODE_ARCHS"
          [[ " $APP_ARCHS " == *" arm64 "* ]] || { echo "::error::native .app 不是 arm64：$APP_ARCHS"; exit 1; }
          [[ " $NODE_ARCHS " == *" arm64 "* ]] || { echo "::error::捆绑 node 不是 arm64：$NODE_ARCHS"; exit 1; }
          # P4(c)：release-artifacts 清单是真实消费者——要上传的 native 文件名
          # 必须逐字等于清单（碰撞断言因此观察到真实版本号）。
          node scripts/release/release-artifacts.mjs "$VERSION" --check-dir macos/release
          # G29：只断言精确产物名（BASE = artifactBasename）——输出目录可能并存
          # 旧版本归档，glob 断言会被它们满足，上传也会把它们一起带走。
          test -f "${BASE}.dmg"
          test -f "${BASE}.zip"
          # P4(b)：验证**上传的 blob 本身**，而不是归档前的 .app——解出 zip 内的
          # .app 再跑 codesign/架构/stapler/spctl；打包顺序倒退或 zip 损坏都在
          # 这里红，而不是等用户下载后才发现。
          EXTRACT="$RUNNER_TEMP/dsh-chamber-native-zip-verify"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          ditto -x -k "${BASE}.zip" "$EXTRACT"
          # --keepParent 的归档恒有一个顶层 <App>.app；直接定位，避免 find|head
          # 在 pipefail 下的 SIGPIPE 噪声。
          ZIP_APP="$EXTRACT/dsh-chamber-native.app"
          test -d "$ZIP_APP"
          codesign --verify --deep --strict --verbose=2 "$ZIP_APP"
          [[ " $(lipo -archs "$ZIP_APP/Contents/MacOS/DSHChamberPoc") " == *" arm64 "* ]] \
            || { echo "::error::zip 内 .app 不是 arm64"; exit 1; }
          [[ " $(lipo -archs "$ZIP_APP/Contents/Resources/sidecar/node") " == *" arm64 "* ]] \
            || { echo "::error::zip 内捆绑 node 不是 arm64"; exit 1; }
          if [[ "$DRY_RUN" != "true" ]]; then
            codesign -dv --verbose=4 "$ZIP_APP" 2>&1 | tee /tmp/swift-codesign-dv.txt
            grep -q 'Authority=Developer ID' /tmp/swift-codesign-dv.txt
            xcrun stapler validate "$ZIP_APP"
            xcrun stapler validate "$APP"
            xcrun stapler validate "${BASE}.dmg"
            spctl --assess --type execute --verbose=4 "$ZIP_APP"
          fi
        env:
          VERSION: ${{ needs.create-release.outputs.version }}

      - name: Upload native artifacts (draft release + rolling beta channel)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          # S-23：stable 发布刷新滚动 beta appcast 需要同一把 EdDSA 私钥（stable
          # appcast 的生成在 appcast 步；这里是 beta 通道的 final 可见性刷新）。
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          BASE="macos/release/dsh-chamber-native-${VERSION}-macos-arm64"
          # G29：精确路径，绝不 glob（旧版本归档可能残留并与 *.dmg/*.zip 匹配）。
          gh release upload "v${VERSION}" \
            "${BASE}.dmg" "${BASE}.zip" --clobber
          # S-22/S-36：beta 通道在 verify 之后才滚动发布（rolling release 是公开
          # 面）。顺序固定「归档 → appcast」：appcast 的每个 enclosure
          # （--download-url-prefix 钉在滚动 tag）必须先有可下载的 zip，beta 客户端
          # 才可能解析到一个指向缺失 asset 的 enclosure。stable 通道绝不被改写
          # （appcast-swift.xml / releases/latest 形状不变），但 S-23 会在同一分支
          # **刷新滚动 beta appcast**（final 对 beta 客户端可见）。私钥缺失时 appcast
          # 步 loud 跳过、这里也 loud 跳过——照常发布，只是原生腿看不到这次更新。
          if [[ "$VERSION" == *-* ]]; then
            BETA_APPCAST="macos/release/appcast-swift-beta.xml"
            STAGED_ZIP="/tmp/appcast-in/$(basename "${BASE}.zip")"
            if [[ ! -f "$BETA_APPCAST" ]]; then
              echo "::warning::beta appcast 缺失（SPARKLE_PRIVATE_KEY 未配置或 appcast 步未运行）——跳过滚动发布"
            elif [[ ! -f "$STAGED_ZIP" ]]; then
              echo "::error::appcast 引用的 beta zip 不在收件目录（$STAGED_ZIP）——拒绝滚动发布"
              exit 1
            else
              ROLLING_TAG="${SPARKLE_BETA_ROLLING_TAG}"
              if ! gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                gh release create "$ROLLING_TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --target "$GITHUB_SHA" \
                  --prerelease \
                  --title "dsh-chamber Swift beta appcast (rolling)" \
                  --notes "Rolling release carrying appcast-swift-beta.xml and the archives its enclosures reference for the Swift native shell's beta channel. Republished by every beta; do not delete."
              fi
              # 先归档（当前 beta + 最新 final；每个 beta zip 名带版本号，--clobber
              # 不抹掉更早 beta 的包），再 appcast——enclosure 逐条可下载。
              # V1 复核补漏：generate_appcast 还会产出 .delta 并在 appcast 里引用它，
              # 只传 *.zip 会让 delta enclosure 404（Sparkle 会回退整包，但仍属坏链路）。
              for ARCHIVE in /tmp/appcast-in/*.zip /tmp/appcast-in/*.delta; do
                [[ -f "$ARCHIVE" ]] || continue
                gh release upload "$ROLLING_TAG" "$ARCHIVE" --clobber
              done
              gh release upload "$ROLLING_TAG" "$BETA_APPCAST" --clobber
              echo "beta 滚动通道已发布（归档 + appcast）"
            fi
          else
            # S-23：final 发布也要刷新滚动 beta appcast——beta 客户端因此能看到 final
            # （beta→final 的通道可见性；Electron 经 latest.yml 回退天然可见）。只在
            # 滚动 release 已存在且本次 appcast 真的生成时刷新（绝不从 stable 腿创建
            # 或激活 beta 通道）；刷新保留滚动 release 上版本最高的 beta zip 条目。
            ROLLING_TAG="${SPARKLE_BETA_ROLLING_TAG}"
            STABLE_APPCAST="macos/release/appcast-swift.xml"
            if [[ ! -f "$STABLE_APPCAST" ]]; then
              echo "::warning::stable appcast 缺失（SPARKLE_PRIVATE_KEY 未配置或 appcast 步未运行）——跳过滚动 beta 通道刷新"
            elif ! gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "beta 滚动通道不存在——stable 发布不创建它（没有 beta 客户端需要刷新）"
            else
              test -x /tmp/sparkle-bin/bin/generate_appcast \
                || { echo "::error::缺少 generate_appcast（appcast 步未运行）"; exit 1; }
              rm -rf /tmp/appcast-stable-refresh /tmp/appcast-stable-refresh-out
              mkdir -p /tmp/appcast-stable-refresh /tmp/appcast-stable-refresh-out
              BETA_ZIP_NAME="$(gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '.assets[].name' \
                | grep -E '^dsh-chamber-native-[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+-macos-arm64\.zip$' \
                | sort -V | tail -n 1)"
              if [[ -n "$BETA_ZIP_NAME" ]]; then
                gh release download "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$BETA_ZIP_NAME" \
                  --dir /tmp/appcast-stable-refresh --clobber
                echo "刷新滚动 beta appcast：保留 beta 条目 $BETA_ZIP_NAME"
              else
                echo "::warning::滚动通道没有 beta zip 资产——刷新后的 appcast 只含 final 条目"
              fi
              cp "${BASE}.zip" /tmp/appcast-stable-refresh/
              printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/ed-key-refresh.txt
              /tmp/sparkle-bin/bin/generate_appcast --ed-key-file /tmp/ed-key-refresh.txt \
                --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROLLING_TAG}/" \
                -o /tmp/appcast-stable-refresh-out /tmp/appcast-stable-refresh
              rm -f /tmp/ed-key-refresh.txt
              test -f /tmp/appcast-stable-refresh-out/appcast.xml \
                || { echo "::error::滚动 beta appcast 刷新失败（generate_appcast 无输出）"; exit 1; }
              # 归档先于 appcast（每个 enclosure 先有可下载资产）；final zip 也因此
              # 落到滚动 release（刷新前缀指向它）。
              cp /tmp/appcast-stable-refresh-out/appcast.xml \
                /tmp/appcast-stable-refresh-out/appcast-swift-beta.xml
              for ARCHIVE in /tmp/appcast-stable-refresh/*.zip /tmp/appcast-stable-refresh/*.delta; do
                [[ -f "$ARCHIVE" ]] || continue
                gh release upload "$ROLLING_TAG" "$ARCHIVE" --clobber
              done
              gh release upload "$ROLLING_TAG" /tmp/appcast-stable-refresh-out/appcast-swift-beta.xml --clobber
              echo "stable 发布已刷新滚动 beta appcast：final $VERSION 对 beta 客户端可见"
            fi
          fi

  finalize-release:
    needs: [create-release, build-gateway, build-macos, build-windows, build-linux, build-swift]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Drop mac zip.blockmap assets from the draft release
        # 2026-08 (v0.1.2 postmortem): electron-builder hardcodes the mac zip
        # target's isWriteUpdateInfo=true (MacPackager.createTargets), so the
        # mac leg always uploads a .zip.blockmap sidecar. The feeds never
        # reference it (latest-mac.yml carries only zip sha512/size/url), so
        # it is deleted from the DRAFT before finalize — releases ship without
        # any .blockmap (Windows has differentialPackage=false already). The
        # blockmap is harmless-but-extra; deleting keeps the artifact list
        # minimal and matches the v0.1.1 release shape.
        #
        # Resolved by RELEASE ID from create-release (not tags/{tag} — that
        # endpoint does not reliably resolve a draft). FAILS LOUD on any gh
        # api error (the first version swallowed failures with `|| true`,
        # leaving the blockmap in the published release).
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="${{ needs.create-release.outputs.release_id }}"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "::error::create-release did not expose a release id — cannot clean blockmap assets"
            exit 1
          fi
          ASSET_IDS=$(gh api \
            "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name | endswith(".blockmap")) | .id')
          if [[ -z "$ASSET_IDS" ]]; then
            echo "no .blockmap assets in draft release — nothing to drop"
            exit 0
          fi
          for ASSET_ID in $ASSET_IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID" >/dev/null
            echo "dropped .blockmap asset $ASSET_ID"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release (flip draft to public)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_ID" ]]; then
            echo "::error::create-release did not expose a release id — cannot publish"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/releases/${RELEASE_ID}" -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          else
            gh api -X PATCH "repos/${{ github.repository }}/releases/${RELEASE_ID}" -F draft=false -F prerelease=false -f make_latest=true >/dev/null
          fi
