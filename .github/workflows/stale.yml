name: stale

on:
  schedule:
    - cron: '30 2 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: enhancement
          close-issue-message: >-
            This issue has been closed because it was stale for 14 days with no
            activity. Feel free to reopen with updated information.
          close-pr-message: >-
            This pull request has been closed because it was stale for 14 days
            with no activity. Feel free to reopen with updated information.
