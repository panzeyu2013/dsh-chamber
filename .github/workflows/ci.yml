name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Validation chain only — no desktop packaging (fast). Packaging is built and
  # published exclusively by release.yml (tag v* / workflow_dispatch), where the
  # bundler runs with the DSH_CHAMBER_DSH_VERSION matching the committed runtime
  # lockfile. Keeping packaging out of the push path keeps ordinary pushes fast
  # (2026-08 decision): the v0.1.4 CI packaging jobs carried a stale hardcoded
  # DSH_CHAMBER_DSH_VERSION and failed every run with ERR_PNPM_OUTDATED_LOCKFILE
  # — if packaging jobs ever return to CI, their version env must be synced too.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: pnpm
      # Bootstrap the vendor symlink tree BEFORE pnpm install: pnpm captures the
      # workspace snapshot before preinstall runs, so the links must already
      # exist for the install to resolve the full @deepseek-ai/* workspace.
      # The managed snapshot (vendor/harness-checkout) is cached by pin; on a
      # cache hit the bootstrap reuses it, on a miss it downloads from codeload.
      - name: Cache pinned harness snapshot
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: vendor/harness-checkout
          key: harness-${{ hashFiles('harness.commit') }}
      - name: Bootstrap vendor tree
        run: node scripts/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile
      - name: Type check (tsc + chamber host packages)
        run: |
          pnpm run typecheck
          pnpm run typecheck:host-graph
          pnpm run typecheck:host-git
      - name: i18n pair consistency
        run: pnpm run verify:i18n
      - name: Control-plane unit tests
        run: |
          node packages/control-plane/test/protocol.ts
          node packages/control-plane/test/storage.ts
          node packages/control-plane/test/m1-dsh-client.ts
          node packages/control-plane/test/host-logs.ts
          node packages/control-plane/test/manager-api.ts
          node packages/control-plane/test/instance-proxy.ts
          node packages/control-plane/test/ws-frames.ts
          node packages/control-plane/test/static-serving.ts
          node packages/control-plane/test/host-graph-seed.ts
      - name: Desktop unit tests (transport / ssh)
        run: pnpm run test:desktop
      - name: Renderer shell unit tests
        run: pnpm run test:renderer-shell
      - name: Client plugin type checks (sidebar / git / layout / connections / settings-bridge / client-web / open-in)
        run: |
          pnpm run typecheck:sidebar
          pnpm run typecheck:git
          pnpm run typecheck:layout
          pnpm run typecheck:connections
          pnpm run typecheck:settings-bridge
          pnpm run typecheck:client-web
          pnpm run typecheck:open-in
      - name: Client and host plugin unit tests (sidebar / git / settings-bridge / connections / client-web / connection)
        run: |
          pnpm run test:sidebar
          pnpm run test:git
          pnpm run test:host-git
          pnpm run test:settings-bridge
          pnpm run test:connections
          pnpm run test:client-web
          pnpm run test:connection
      # SKIPs when the checkout carries no bundled dsh runtime — normal here,
      # since only packages/desktop/vendor/dsh/pnpm-lock.yaml is committed and
      # node_modules is never committed; the gate requires a real dsh CLI entry
      # (2026-08 fix). A real SMOKE PASS happens in release.yml's build-macos
      # job against the freshly bundled runtime.
      - name: Smoke test
        run: pnpm run smoke
      - name: Renderer build
        run: pnpm run build:renderer
