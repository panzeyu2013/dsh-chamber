name: CI

on:
  # Branch pushes and PRs only (2026-09 CI-trigger revision): tag pushes used to
  # run this chain as well. The linux leg stepped aside for tags (release.yml's
  # validation is its mechanical superset) while the windows leg re-ran the
  # identical SHA, and tagging a commit that never went through `main` skipped the
  # linux chain entirely. A release now PROVES its commit passed here instead:
  # release.yml's validation runs scripts/release/verify-release-ci-proof.mjs, which
  # requires a completed, successful ci.yml push run on main whose linux, Windows
  # and macOS legs all passed.
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for pull requests (iterative pushes), but QUEUE branch
# pushes: with the change classifier below, a prose-only follow-up push runs
# only the file-only gates — if it also cancelled the run before it, the code
# commit it followed would end up with no validation at all, which is worse than
# a queued run. Release publication has its own workflow and group
# (release-publish, cancel-in-progress: false); cancelling a CI run can never
# weaken a release gate, because release.yml re-validates its own commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Validation chain only — no desktop packaging (fast). Packaging is built and
  # published exclusively by release.yml (tag v* / workflow_dispatch), where the
  # bundler runs with the DSH_CHAMBER_DSH_VERSION matching the committed runtime
  # lockfile. Keeping packaging out of the push path keeps ordinary pushes fast
  # (2026-08 decision): the v0.1.4 CI packaging jobs carried a stale hardcoded
  # DSH_CHAMBER_DSH_VERSION and failed every run with ERR_PNPM_OUTDATED_LOCKFILE
  # — if packaging jobs ever return to CI, their version env must be synced too.
  test:
    # Branch pushes and PRs only — no tag trigger exists (see `on:` above).
    # release.yml's validation mirrors this chain (the alignment contract is
    # asserted in scripts/release/release-workflow-policy.test.mjs) and proves its
    # commit ran it here, on main, with this job and the windows + macOS legs
    # green (verify-release-ci-proof.mjs names all three jobs explicitly).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The pinned harness source tree is a git submodule
          # (vendor/harness-checkout, gitlink == harness.commit). The gitlink
          # pins an exact commit, so the submodule is materialized at that
          # commit regardless of clone depth.
          submodules: true
          # The change classifier diffs the pushed range, so the two endpoints
          # must exist locally.
          fetch-depth: 0
      # Decide whether the expensive chain (install → type checks → unit suites
      # → builds → gateway pack) is relevant for this push. The file-only gates
      # below are NOT gated: a prose change still gets the gates that can see it
      # (i18n drift lives in prose). The classifier fails safe — anything it
      # cannot prove to be prose counts as code.
      - name: Classify the change (prose-only pushes skip the expensive chain)
        id: classify
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_AFTER: ${{ github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/gates/classify-ci-changes.mjs
      - name: Verify workflow action pins
        run: node scripts/gates/verify-workflow-action-pins.mjs
      # The pin check above reads the workflows as TEXT, so it stays green on a
      # file GitHub refuses to parse (2026-12: an inserted `single entry: …`
      # step name was invalid YAML and every local gate passed). This closes
      # that gap without adding a YAML dependency.
      - name: Verify workflow YAML scalars
        run: node scripts/gates/verify-workflow-yaml-scalars.mjs
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # Bootstrap the vendor symlink tree BEFORE pnpm install: pnpm captures the
      # workspace snapshot before preinstall runs, so the links must already
      # exist for the install to resolve the full @deepseek-ai/* workspace.
      # The script verifies submodule HEAD == harness.commit (fail-closed on
      # drift) and is idempotent (no-op when the link set is unchanged).
      - name: Bootstrap vendor tree (verify pin + ensure links)
        run: node scripts/dev/ensure-harness-vendor.mjs
      # Upstream-touchpoint registry gates (docs/checklists/upstream-touchpoints.md):
      # C1 pure fork files must stay byte-identical, C3 every fork/upstream file
      # has a ruling, C5 anchors must not go stale, C6 EXCLUDED dirs must exist,
      # C9 vendor patch anchors must match the pin, C11–C14 plugin protection
      # (runtime family set / profile contract / seed registry / manifest mirror,
      # design 21 §6.11) — all file-only, so they run before the install
      # (fail fast). C8 (committed artifacts == sources)
      # rebuilds with esbuild and therefore needs node_modules — it runs in the
      # post-install step below; here it is explicitly advisory.
      - name: Upstream touchpoint registry (C1/C3/C4/C5/C6/C7/C9/C10 + C11–C15)
        run: node scripts/upstream/verify-upstream-touchpoints.mjs --no-artifact-rebuild
      - run: pnpm install --frozen-lockfile
        if: steps.classify.outputs.code == 'true'
      # C8 deterministic artifact gate: rebuilds the committed host/mobile
      # bundles in place, byte-compares, restores. A skipped build (missing
      # esbuild) is a loud warning, never a silent pass.
      - name: Committed artifacts match sources (C8 rebuild gate)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/upstream/verify-upstream-touchpoints.mjs
      # The lockfile is the deterministic contract between the committed
      # workspace members and the resolution result; a non-frozen install
      # must never silently rewrite it (pnpm 11 prunes symlinked-member
      # importer records). Fail the run if it moved.
      - name: Assert lockfile not rewritten
        if: steps.classify.outputs.code == 'true'
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Type check (tsc + chamber host packages + gateway)
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm run typecheck
          pnpm run typecheck:host-graph
          pnpm run typecheck:host-git
          pnpm run typecheck:host-archive-cleanup
          pnpm run typecheck:host-open-in
          pnpm run typecheck:gateway
          pnpm run typecheck:runtime
      - name: i18n pair consistency
        run: pnpm run verify:i18n
      # File-only, so NOT behind the classifier: every *.test.ts / *.test.mjs
      # must be reachable from a script that runs (verify-test-wiring), and every
      # relative markdown link must resolve (verify-md-links). Both are named in
      # run-checks.mjs static and release validation; their job here is the same
      # one: a newly added test file (or a doc link) must not sit unexecuted.
      - name: Test wiring gate
        run: pnpm run verify:test-wiring
      - name: Markdown link gate
        run: pnpm run verify:md-links
      # Upstream registry single source (2026-12): schema/canonical/reference checks,
      # the coverage net (checklist headings ↔ entries, chamberNamedForks,
      # ensure-harness-vendor EXCLUDED) and generated-view freshness; the anchor probe
      # keeps registry symbol anchors resolvable and the legacy 文件:行 budget ratcheted
      # (只降不升). File-only gates, so NOT behind the classifier; both need the
      # bootstrapped vendor tree (Bootstrap step above).
      - name: Upstream registry integrity (schema/references/views)
        run: pnpm run verify:registry
      - name: Upstream anchor probe (symbol anchors + legacy budget)
        run: pnpm run verify:anchors
      # Upstream design-token conformance: S1 未声明 --dsw-* 引用 / S2 命名空间越界 /
      # S3 0.5px 发丝线 / S4 字面量 fallback / S5 边框+阴影配对 / S6 死声明 /
      # S7 全圆角配对. Upstream enforces these with specs that scan ITS OWN
      # packages/; chamber's packages are outside that scan, so this gate applies
      # the same rules across every chamber package and every CSS-carrying file
      # kind. Needs the bootstrapped vendor tree (Bootstrap step above).
      - name: Upstream design-token conformance (S1–S7)
        run: pnpm run verify:styles
      - name: Workflow action pins resolve upstream (release-preflight --actions-only)
        run: node scripts/release/release-preflight.mjs --actions-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release workflow safety policy
        run: pnpm run test:release-workflow
      # Upgrade tooling (pin preflight classification + lockfile vendor-record
      # restore guard + the upstream gate's CLI argument guard): advisory
      # tooling, but its classification drives real pin-bump decisions, and the
      # argument guard is what keeps a mistyped flag from silently triggering
      # the gate's in-place artifact rebuild — so the pure helpers are pinned
      # here.
      - name: Dev tooling unit tests (pin preflight / lockfile restore guard / upstream gate CLI guard / CI change classifier)
        run: pnpm run test:upgrade-tools
      # The GUI acceptance toolbox's judgement layer only: the driving layer needs
      # a display plus a running app, so it stays a local gate
      # (docs/checklists/gui-acceptance-checklist.md). Every pass/fail predicate
      # is pure and pinned here, exactly like the other scripts/ tools.
      - name: GUI acceptance toolbox unit tests (pure judgement layer)
        run: pnpm run test:gui-acceptance
      # One entry for the package test set (2026-12): the same mode is what
      # `pnpm run check:tests` runs locally, so the push path and a developer's
      # terminal cannot drift. Adding or renaming a package suite means editing
      # scripts/gates/run-checks.mjs once; `pnpm run test:release-workflow` keeps
      # release validation aligned with what this step runs.
      - name: Package unit tests — single entry (runtime / control-plane / desktop / gateway / renderer-shell / client+host plugins)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/gates/run-checks.mjs tests
      # Client plugin compiler faces, same single entry as `pnpm run check:typecheck`.
      - name: Client plugin type checks — single entry (sidebar / git / layout / connections / settings-bridge / client-web / connection / api-gateway / open-in / mobile)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/gates/run-checks.mjs typecheck
      # Runs `pnpm run smoke`; it SKIPs when the checkout carries no bundled
      # dsh runtime — normal here, since only
      # packages/desktop/vendor/dsh/pnpm-lock.yaml is committed and
      # node_modules is never committed; the gate requires a real dsh CLI
      # entry (2026-08 fix). The release path currently has NO smoke either:
      # release.yml's build jobs only package and structurally verify the
      # bundle (vendor/dsh presence + platform) — a smoke pass against the
      # freshly bundled runtime is not wired up anywhere.
      #
      # 2026-12 review P2 — the SKIP is a documented contract of the smoke
      # entry (packages/control-plane/test/smoke.test.ts: "dsh unavailable …
      # exits 0"), so it must NOT be turned into a red gate here; that would
      # make every ordinary push red and the release path could not run it at
      # all. Instead the step accepts exactly TWO outcomes and refuses every
      # other one: an explicit `SMOKE PASS`, or an explicit `SKIP: …` whose
      # reason is echoed as a workflow notice (visible in the run summary
      # instead of a green step that proves nothing). A silent exit 0 — the
      # failure mode that made this step unreadable — now fails the job.
      # `set -euo pipefail` is explicit (not inherited from the runner's shell
      # wrapper) so a real smoke failure can neither be swallowed by `tee` nor
      # fall through to a later command.
      - name: Smoke test (explicit SKIP, never an implicit pass)
        if: steps.classify.outputs.code == 'true'
        run: |
          set -euo pipefail
          pnpm run smoke | tee /tmp/dsh-chamber-smoke.log
          if grep -q '^SMOKE PASS$' /tmp/dsh-chamber-smoke.log; then
            echo "smoke exercised the control plane against a real dsh runtime"
          elif grep -q '^SKIP: ' /tmp/dsh-chamber-smoke.log; then
            echo "::notice title=smoke SKIPPED (not exercised)::$(grep -m1 '^SKIP: ' /tmp/dsh-chamber-smoke.log)"
          else
            echo "::error title=smoke produced neither a pass nor a skip::pnpm run smoke exited 0 without printing 'SMOKE PASS' or 'SKIP: <reason>'"
            exit 1
          fi
      - name: Renderer build
        if: steps.classify.outputs.code == 'true'
        run: pnpm run build:renderer
      # Host-package esbuild bundles (dsh-chamber-seed-client-graph /
      # dsh-chamber-seed-git-worktree / dsh-chamber-seed-archive-cleanup /
      # dsh-chamber-seed-open-in — dist/index.js) only used to build in
      # release — their esbuild entry/external mapping is an independent
      # failure mode, so the push path validates them too (2026 round-3
      # review).
      - name: Host package builds
        if: steps.classify.outputs.code == 'true'
        run: pnpm run build:host-packages
      # Desktop packaging sub-steps (control-plane bundle / preload / host
      # package) run in CI too — a PR breaking them must not wait for a
      # release to surface (bundle:dsh stays release-only: it bakes the host
      # platform's dsh runtime).
      - name: Desktop build sub-steps
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm --filter @dsh-chamber/desktop run build:control-plane
          pnpm --filter @dsh-chamber/desktop run build:preload
          pnpm --filter @dsh-chamber/desktop run build:host-graph-package
      # Third-party notices must track the installed dependency set; a
      # stale committed file fails the push (2026 review).
      - name: Third-party notices current
        if: steps.classify.outputs.code == 'true'
        run: node scripts/release/gen-third-party-notices.mjs && git diff --exit-code -- THIRD_PARTY_NOTICES.md docs/THIRD_PARTY_NOTICES.en-US.md
      - name: Gateway package build and installed CLI smoke
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm run build:dsh-runtime
          mkdir -p /tmp/dsh-gateway-pack /tmp/dsh-gateway-install
          pnpm --filter @dsh-chamber/gateway pack --pack-destination /tmp/dsh-gateway-pack
          npm install --ignore-scripts --prefix /tmp/dsh-gateway-install /tmp/dsh-gateway-pack/*.tgz
          /tmp/dsh-gateway-install/node_modules/.bin/gateway --help

  # Windows contract leg (Windows 首版推进, M0): mirrors the linux test job
  # for the platform-sensitive suites. This is where the win32-only lifecycle
  # integration tests run and where the remaining `skip: platform === 'win32'`
  # points are tracked (docs/progress/todo/windows-v1.md holds the ledger and the recording rules).
  # Packaging stays in release.yml (build-windows); no smoke/builds here yet.
  test-windows:
    runs-on: windows-2022
    steps:
      # Normalize BEFORE checkout: actions/checkout materializes the tree with
      # the runner's global git config — autocrlf would rewrite text files and
      # make the lockfile diff assertion (below) fail on every run, and
      # core.symlinks=false would degrade any repository symlink to a plain
      # file copy.
      - name: Normalize git autocrlf and symlink handling
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The pinned harness source tree is a git submodule
          # (vendor/harness-checkout, gitlink == harness.commit). The gitlink
          # pins an exact commit, so the submodule is materialized at that
          # commit regardless of clone depth. STATUS.md tracks the remaining
          # acceptance: submodule materialization + junction link creation on
          # a real Windows runner (this job IS that acceptance).
          submodules: true
          # The change classifier diffs the pushed range, so both endpoints must exist locally.
          fetch-depth: 0
      - name: Verify workflow action pins
        run: node scripts/gates/verify-workflow-action-pins.mjs
      # Same classifier as the linux leg: a prose-only branch push skips the
      # windows runner entirely. Releases never come here (there is no tag
      # trigger) — they prove THIS job's success on main through
      # verify-release-ci-proof.mjs, which is why the proof names `test-windows`
      # explicitly: release.yml has no win32-semantics leg of its own.
      - name: Classify the change (prose-only pushes skip the win32 contracts)
        id: classify
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_AFTER: ${{ github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/gates/classify-ci-changes.mjs
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # Bootstrap the vendor symlink/junction tree BEFORE pnpm install (same
      # ordering rationale as the linux leg; ensure-harness-vendor.mjs already
      # creates junctions on win32).
      - name: Bootstrap vendor tree (verify pin + ensure links)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/dev/ensure-harness-vendor.mjs
      # Upstream-touchpoint registry gates (docs/checklists/upstream-touchpoints.md):
      # C1 pure fork files must stay byte-identical, C3 every fork/upstream file
      # has a ruling, C5 anchors must not go stale, C6 EXCLUDED dirs must exist,
      # C9 vendor patch anchors must match the pin, C11–C14 plugin protection
      # (design 21 §6.11), C15 the hover-port retirement gate — file-only,
      # pre-install.
      - name: Upstream touchpoint registry (C1/C3/C5/C6/C9 + C11–C15)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/upstream/verify-upstream-touchpoints.mjs --no-artifact-rebuild
      - run: pnpm install --frozen-lockfile
        if: steps.classify.outputs.code == 'true'
      # C8 deterministic artifact gate (see the linux leg): needs node_modules.
      - name: Committed artifacts match sources (C8 rebuild gate)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/upstream/verify-upstream-touchpoints.mjs
      - name: Assert lockfile not rewritten
        if: steps.classify.outputs.code == 'true'
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Type check (tsc + chamber host packages + gateway + runtime)
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm run typecheck
          pnpm run typecheck:host-graph
          pnpm run typecheck:host-git
          pnpm run typecheck:host-archive-cleanup
          pnpm run typecheck:host-open-in
          pnpm run typecheck:gateway
          pnpm run typecheck:runtime
      # Upstream design-token conformance (S1–S7) — see the linux leg. File-only
      # and platform-neutral, so it runs here too.
      - name: Upstream design-token conformance (S1–S7)
        if: steps.classify.outputs.code == 'true'
        run: pnpm run verify:styles
      # Windows leg consumes each package's platform manifest — `test:win32`
      # scripts in package.json are the single source of truth (structural
      # rule, 2026-09): no test file lists live in this YAML. Pre-M2b the
      # dsh-runtime store semantics are POSIX-only by design (private-fs fails
      # closed without O_NOFOLLOW), so the full POSIX suites run on the POSIX
      # legs; each package's test:win32 lists its win32-real / platform-
      # neutral gates and is extended as Windows semantics land (M2b) — in
      # the package, next to the tests, never here.
      # The three manifests are also reachable as one root fan-out
      # (`pnpm run test:win32`, root package.json — 2026-12 review P2: without
      # it the Windows list could not be reproduced from a local checkout at
      # all). This leg keeps the three named steps so a failure names the
      # owning package.
      - name: dsh-runtime test:win32 manifest
        if: steps.classify.outputs.code == 'true'
        run: pnpm --filter @dsh-chamber/dsh-runtime run test:win32
      - name: control-plane test:win32 manifest (real CIM/netstat/taskkill integration)
        if: steps.classify.outputs.code == 'true'
        run: pnpm --filter @dsh-chamber/control-plane run test:win32
      - name: desktop test:win32 manifest (real icacls)
        if: steps.classify.outputs.code == 'true'
        run: pnpm --filter @dsh-chamber/desktop run test:win32
      # Credential-free packaging rehearsal (2026-12). Until now the first place a
      # Windows packaging regression could surface was inside release.yml — the
      # workflow that already holds the release credentials. This leg builds the
      # desktop payload and runs electron-builder with `--publish=never`, so a
      # broken `files`/`extraResources`/beforePack/afterPack path fails on an
      # ordinary master push instead. Two deliberate limits: it never runs on pull
      # requests (minutes of NSIS toolchain work per PR is not worth the signal),
      # and it uploads nothing — the point is that packaging succeeds, not that an
      # artifact is kept.
      - name: Windows packaging rehearsal (no publish, no credentials)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.classify.outputs.code == 'true'
        run: |
          pnpm run build:desktop
          # exec, not `run dist:win -- --publish=never`: pnpm forwards its own `--`
          # separator to the script, so electron-builder received
          # `--win --x64 "--" "--publish=never"`, treated the flag as a positional
          # argument, fell back to CI implicit publishing and died on the missing
          # GH_TOKEN. This mirrors the release workflow's own invocation.
          pnpm --filter @dsh-chamber/desktop exec electron-builder --win --x64 --publish=never

  # macOS Swift shell leg (design 25, W-26): the SwiftPM package, the JS↔Swift
  # bridge manifest lockstep and the packaging inputs are macOS-only surfaces —
  # without this job a Swift/bridge/manifest regression lands unnoticed until a
  # release. Deliberately NOT a packaging job: the .app/sidecar assembly and
  # the real Node download stay in release.yml (network + credentials), and the
  # expensive desktop suite keeps running on the linux leg. The macOS-only
  # desktop tests (the darwin lock assertions and the build-sidecar /
  # build-swift-app packaging-script suites) live in the package's MACOS_FILES
  # list (packages/desktop/scripts/test.mjs) and run HERE via test:macos, never
  # on the ubuntu leg; this job also re-runs the cheap bridge gates, the Swift
  # suite in the release configuration (XCTSkip == 0), the compiled sidecar
  # smoke and the packaging dry runs. A prose-only push skips the whole
  # leg through the same classifier as test/test-windows.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The pinned harness source tree is a git submodule (gitlink ==
          # harness.commit); the Swift package itself has zero third-party
          # dependencies (AppKit/WebKit only).
          submodules: true
          # The change classifier diffs the pushed range, so both endpoints must
          # exist locally.
          fetch-depth: 0
      - name: Verify workflow action pins
        run: node scripts/gates/verify-workflow-action-pins.mjs
      # Same classifier as test/test-windows: a prose-only branch push skips the
      # macOS runner (Swift build + packaging suites) entirely. Releases prove
      # THIS job's success on main through verify-release-ci-proof.mjs.
      - name: Classify the change (prose-only pushes skip the macOS/Swift leg)
        id: classify
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_AFTER: ${{ github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/gates/classify-ci-changes.mjs
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Bootstrap vendor tree (verify pin + ensure links)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/dev/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile
        if: steps.classify.outputs.code == 'true'
      - name: Assert lockfile not rewritten
        if: steps.classify.outputs.code == 'true'
        run: git diff --exit-code -- pnpm-lock.yaml
      # DSH_CHAMBER_SHELL_NODE_BIN turns the 8 Swift↔sidecar integration tests from
      # XCTSkip into real runs (they spawn `node packages/desktop/sidecar-entry.ts`);
      # locally verified 8/8 green with a plain node binary (2026-09 三审 #3).
      # This raw step stays the release proof's pinned anchor (G25,
      # REQUIRED_JOB_STEPS in release-workflow-policy.test.mjs); the gated
      # release run below is the one that enforces the shipped configuration.
      - name: Swift build (release)
        if: steps.classify.outputs.code == 'true'
        working-directory: macos
        run: |
          export DSH_CHAMBER_SHELL_NODE_BIN="$(command -v node)"
          swift build -c release
      # The gate the local/tests mode uses (run-checks `test:swift`): pins
      # `swift test -c release` (G23 — the shipped native binary is a release
      # build, so the release configuration must be the one executed, not
      # merely compiled) and fails on ANY XCTSkip (G2 — the 8 sidecar
      # integration cases must run, never skip to green). The runner defaults
      # DSH_CHAMBER_SHELL_NODE_BIN to its own node, so the integration cases really spawn
      # `packages/desktop/sidecar-entry.ts`. Invoked directly (not through
      # package.json) so the CI contract does not depend on a script alias.
      - name: Swift tests (release configuration, XCTSkip == 0)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/gates/run-swift-tests.mjs
      # JS↔Swift bridge lockstep: the committed bridge-manifest.json /
      # BridgeManifest.swift must equal a regeneration, the shim surface must
      # match preload, and the payload SHAPE at every method call site must
      # match too (the manifest locks channels; the payload gate closes G22's
      # wire-shape gap). Re-running the cheap ones here keeps the macOS leg
      # self-contained when only Swift changes are pushed.
      - name: Bridge manifest + shim surface + payload shape lockstep
        if: steps.classify.outputs.code == 'true'
        run: |
          node packages/desktop/bridge-manifest.test.ts
          node packages/desktop/bridge-shim.test.ts
          node packages/desktop/bridge-shim-surface.test.ts
          node scripts/gates/verify-shim-payload-shape.mjs
      # Packaging inputs, no network / no real Node download: the sidecar
      # assembly needs build:control-plane first, then both packaging scripts
      # validate their plans and layouts (the real Node fetch is release.yml).
      # macOS-only desktop suites (platform-qualified manifest, same discipline
      # as test:win32): the darwin O_EXLOCK lock assertions and the two
      # packaging-script suites need macOS tools (plutil/codesign/ditto), the
      # SwiftPM .build output and dist/control-plane — so they live in
      # `test:macos` and run HERE, never in the ubuntu `test` leg.
      - name: Packaging + darwin lock suites (test:macos)
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm --filter @dsh-chamber/desktop run build:control-plane
          pnpm --filter @dsh-chamber/desktop run test:macos
      # Executed-assembly gate (G4): build the sidecar from the same sources
      # Swift ships (no network — --skip-node/--skip-vendor; the host packages
      # are not needed to boot and answer dsh-chamber:info) and run the REAL
      # sidecar.js with DSH_CHAMBER_SIDECAR_COMPILED=1. A bundle that cannot
      # boot fails here instead of after signing. A missing artifact is a hard
      # failure once the marker is set; without the marker the gate prints a
      # loud SKIP, never a silent pass.
      - name: Compiled sidecar smoke (shipped sidecar.js executes)
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm run build:sidecar --skip-node --skip-vendor --skip-host-packages
          DSH_CHAMBER_SIDECAR_COMPILED=1 node scripts/gates/compiled-sidecar-smoke.mjs
      # G33 machine gate: the native GUI acceptance used to be manual-only
      # (pnpm run acceptance:gui --flavor native), so nothing in CI pinned that
      # the native assembly the packaged Swift shell spawns actually launches
      # and serves. This step drives the sidecar built by the step above (the
      # NDJSON B bridge ready/info/settings frames, /health, the hostile-Origin
      # fence, the shell index when the assembly carries dist/web, and a clean
      # SIGTERM exit) and passes --require-assembly so a missing/skipped build
      # prerequisite is a hard FAIL instead of a loud SKIP. The WKWebView UI
      # and the .app double-click path still cannot be driven headlessly (no
      # CDP endpoint): those stay documented real-machine acceptance items.
      - name: Native assembly acceptance (spawned sidecar boots + serves)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/gui-acceptance/run.mjs --flavor native --require-assembly
      # Electron compiled-artifact smoke (G4 residual): the compiled
      # dist/control-plane entry is spawned electron-free, must bind and answer
      # /health, then exit 0 on SIGTERM; dist/preload.cjs is executed inside
      # node:vm with a stubbed electron and must expose the frozen
      # window.dshChamber surface (4 scalars + 9 namespaces). build:preload is a
      # cheap tsc emit that gives the gate the real artifact. Both artifacts
      # absent = loud SKIP; either present = hard fail (a partial build is a
      # build-order bug, never a silent pass).
      - name: Electron compiled artifacts smoke (control-plane boot + preload surface)
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm --filter @dsh-chamber/desktop run build:preload
          node scripts/gates/verify-electron-artifacts.mjs
      # Packaging dry runs (no network / no real Node download): the sidecar
      # assembly plan and the .app assembly plan validate their inputs.
      - name: Packaging dry runs (sidecar + .app)
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm run build:sidecar --dry-run
          pnpm run build:swift-app --dry-run --skip-build
      # Electron mac packaging rehearsal (2026-12 A2 高危). The electron-builder
      # mac leg used to run for the first time inside release.yml — after the
      # draft release existed and with the Apple credentials loaded — so a broken
      # files/extraResources/beforePack/afterPack path failed the release run
      # itself (both real failures of the 0.3.2-beta series landed there). This
      # step runs the exact release chain on an ordinary main push instead:
      # build:desktop + electron-builder --mac --arm64 --publish=never, ad-hoc
      # signing only, no notarization credentials, no upload. afterPack is the
      # same fail-closed product verifier the release leg executes (G27 Electron
      # payload + the packaged locale assertion), so a packaging regression now
      # fails the push path that the release proof watches
      # (verify-release-ci-proof.mjs REQUIRED_JOB_STEPS pins THIS step name).
      # Same deliberate limits as the Windows rehearsal above: never on pull
      # requests, uploads nothing, exit status is the whole signal.
      - name: macOS packaging rehearsal (ad-hoc, no publish, no credentials)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.classify.outputs.code == 'true'
        env:
          # Never resolve a runner keychain identity: afterPack ad-hoc signs the
          # bundle, exactly like the release dry run. No Apple credential is
          # passed to this step, so notarization cannot run either.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm run build:desktop
          # exec, not `run dist:mac -- --publish=never`: pnpm forwards its own `--`
          # separator to the script (same reason as the Windows rehearsal above).
          pnpm --filter @dsh-chamber/desktop exec electron-builder --mac --arm64 --publish=never
          # The pack above exercised afterPack on the real .app; now assert the
          # staged product itself: the gate's packaged-app arm re-checks the
          # locales electron-builder's electronLanguages matcher can silently
          # delete (A1 zh_CN.lproj/locale.pak regression).
          node scripts/gates/verify-electron-artifacts.mjs
