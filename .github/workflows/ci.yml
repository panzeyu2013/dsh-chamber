name: CI

on:
  # Branch pushes and PRs only: a release PROVES its commit passed here.
  # release.yml's validation runs scripts/release/verify-release-ci-proof.mjs, which
  # requires a completed, successful ci.yml push run on main whose linux and
  # macOS legs all passed. The Windows/Linux desktop legs are ARCHIVED with the
  # Electron flavor (2026-11; docs/progress/electron-frozen.md).
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for pull requests (iterative pushes), but QUEUE branch
# pushes: with the change classifier below, a prose-only follow-up push runs
# only the file-only gates — if it also cancelled the run before it, the code
# commit it followed would end up with no validation at all, which is worse than
# a queued run. Release publication has its own workflow and group
# (release-publish, cancel-in-progress: false); cancelling a CI run can never
# weaken a release gate, because release.yml re-validates its own commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Validation chain only — no desktop packaging (fast). Packaging is built and
  # published exclusively by release.yml (tag v* / workflow_dispatch), where the
  # bundler runs with the DSH_CHAMBER_DSH_VERSION matching the committed runtime
  # lockfile. Keeping packaging out of the push path keeps ordinary pushes fast:
  # if packaging jobs ever return to CI, their DSH_CHAMBER_DSH_VERSION env must
  # be synced with the committed runtime lockfile or they fail every run with
  # ERR_PNPM_OUTDATED_LOCKFILE.
  test:
    # Branch pushes and PRs only — no tag trigger exists (see `on:` above).
    # release.yml's validation mirrors this chain (the alignment contract is
    # asserted in scripts/release/release-workflow-policy.test.mjs) and proves its
    # commit ran it here, on main, with this job and the macOS legs green
    # (verify-release-ci-proof.mjs names every required job explicitly).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The pinned harness source tree is a git submodule
          # (vendor/harness-checkout, gitlink == harness.commit). The gitlink
          # pins an exact commit, so the submodule is materialized at that
          # commit regardless of clone depth.
          submodules: true
          # The change classifier diffs the pushed range, so the two endpoints
          # must exist locally.
          fetch-depth: 0
      # Decide whether the expensive chain (install → type checks → unit suites
      # → builds → gateway pack) is relevant for this push. The file-only gates
      # below are NOT gated: they only need the checked-out tree, so they run on
      # every push, prose included. The classifier fails safe — anything it
      # cannot prove to be prose counts as code.
      - name: Classify the change (prose-only pushes skip the expensive chain)
        id: classify
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_AFTER: ${{ github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/gates/classify-ci-changes.mjs
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # Bootstrap the vendor symlink tree BEFORE pnpm install: pnpm captures the
      # workspace snapshot before preinstall runs, so the links must already
      # exist for the install to resolve the full @deepseek-ai/* workspace.
      # The script verifies submodule HEAD == harness.commit (fail-closed on
      # drift) and is idempotent (no-op when the link set is unchanged).
      - name: Bootstrap vendor tree (verify pin + ensure links)
        run: node scripts/dev/ensure-harness-vendor.mjs
      # GENERATED:gates:ci.test.pre:begin
      # Documentation pair consistency: structure + hash record; cheap, no install needed (also invoked by release-preflight).
      - name: Documentation pair consistency (zh/en)
        run: pnpm run verify:i18n
      - name: Verify workflow action pins
        run: pnpm run verify:workflows
      - name: Verify workflow YAML scalars
        run: pnpm run verify:workflow-yaml
      # Upstream touchpoint registry C1/C3-C16 (advisory mode: reads, never rebuilds artifacts). File-only, runs before the install for fail-fast.
      - name: Upstream touchpoint registry (C1/C3/C4/C5/C6/C7/C9/C10 + C11–C15)
        run: node scripts/upstream/verify-upstream-touchpoints.mjs --no-artifact-rebuild
      # GENERATED:gates:ci.test.pre:end
      - run: pnpm install --frozen-lockfile
        if: steps.classify.outputs.code == 'true'
      # 构建期产物不入 git：C8 默认模式先快照再就地重建-比对，clean checkout
      # 必须在它之前自举这 5 组构建期产物（缺席会被判成 stale）。
      - name: Bootstrap untracked build-time artifacts (C8 input)
        if: steps.classify.outputs.code == 'true'
        run: pnpm run ensure:artifacts
      # C8 deterministic artifact gate: rebuilds the untracked build-time
      # host/runtime bundles in place, byte-compares, restores. A skipped build
      # (missing esbuild) is a loud warning, never a silent pass.
      - name: Build-time artifacts match sources (C8 rebuild gate)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/upstream/verify-upstream-touchpoints.mjs
      # The lockfile is the deterministic contract between the committed
      # workspace members and the resolution result; a non-frozen install
      # must never silently rewrite it (pnpm 11 prunes symlinked-member
      # importer records). Fail the run if it moved.
      - name: Assert lockfile not rewritten
        if: steps.classify.outputs.code == 'true'
        run: git diff --exit-code -- pnpm-lock.yaml
      # GENERATED:gates:ci.test.post:begin
      # Upstream registry: schema/canonical/reference checks plus generated-view freshness. Needs the bootstrapped vendor tree; file-only, never behind the classifier.
      - name: Upstream registry integrity (schema/references/views)
        run: pnpm run verify:registry
      # Anchor probe: registry symbol anchors resolvable + the legacy file:line budget ratcheted (only down).
      - name: Upstream anchor probe (symbol anchors + legacy budget)
        run: pnpm run verify:anchors
      - name: Architecture import cycles
        run: pnpm run verify:import-cycles
      - name: Architecture file budgets
        run: pnpm run verify:file-budgets
      # Capability alignment: a chamber-consumed vendor probe that disappears or a landed upstream replacement turns this red.
      - name: Upstream capability alignment (chamber-behind / upstream-landed)
        run: node scripts/upstream/verify-capabilities.mjs
      - name: Remote-state fault-injection matrix
        run: node scripts/gates/remote-state-injection-matrix.mjs
      - name: Stream-state differential replay (recorded vectors, drift = failure)
        run: node scripts/refactor/equivalence.mjs
      # Cross-language lockstep for the stream-state tables (Swift mirror compiles Foundation-only, in a temp dir).
      - name: Stream-state Swift parity (cross-language lockstep)
        run: node scripts/gates/verify-stream-state-swift-parity.mjs
      - name: Ladder-table parity (B4 lockstep over the four recovery ladders)
        run: node scripts/gates/verify-ladder-table-parity.mjs
      - name: Upstream lifecycle contract (first-frame bound retirement tripwire)
        run: pnpm run verify:upstream-lifecycle-contract
      - name: Architecture package boundaries
        run: pnpm run verify:package-boundaries
      # Every scripts/ suite through the one entry (gates, upstream, release, gui-acceptance); the GUI driving layer stays local (needs a display).
      - name: Script unit tests — single entry (gates / upstream / release / gui-acceptance)
        run: pnpm run test:scripts
      # GENERATED:gates:ci.test.post:end
      - name: Type check (tsc + chamber host packages + gateway)
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm run typecheck
          pnpm run typecheck:host-graph
          pnpm run typecheck:host-git
          pnpm run typecheck:host-archive-cleanup
          pnpm run typecheck:host-open-in
          pnpm run typecheck:gateway
          pnpm run typecheck:runtime
      - name: Workflow action pins resolve upstream (release-preflight --actions-only)
        run: node scripts/release/release-preflight.mjs --actions-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # One entry for the package test set: the same mode is what
      # `pnpm run check:tests` runs locally, so the push path and a developer's
      # terminal cannot drift. Adding or renaming a package suite means editing
      # scripts/gates/run-checks.mjs once; `pnpm run test:scripts:release` keeps
      # release validation aligned with what this step runs.
      - name: Package unit tests — single entry (runtime / control-plane / desktop / gateway / renderer-shell / client+host plugins)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/gates/run-checks.mjs tests
      # 计划的统一验收矩阵：
      # 它按 --node 指定的解释器逐文件跑，
      # 因此 CI 用自带 node；vendor 与 node_modules 在此都已就位，blocked 项应全部转绿。
      - name: Remote-state acceptance matrix
        if: steps.classify.outputs.code == 'true'
        run: node scripts/gates/remote-state-acceptance.mjs --node "$(command -v node)" --out .tmp/acceptance/remote-state.json
      # Client plugin compiler faces, same single entry as `pnpm run check:typecheck`.
      - name: Client plugin type checks — single entry (sidebar / git / layout / connections / settings-bridge / client-web / connection / api-gateway / open-in)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/gates/run-checks.mjs typecheck
      # Runs `pnpm run smoke`; it SKIPs when the checkout carries no bundled
      # dsh runtime — normal here, since only
      # packages/desktop/vendor/dsh/pnpm-lock.yaml is committed and
      # node_modules is never committed; the gate requires a real dsh CLI
      # entry. The release path currently has NO smoke either:
      # release.yml's build jobs only package and structurally verify the
      # bundle (vendor/dsh presence + platform) — a smoke pass against the
      # freshly bundled runtime is not wired up anywhere.
      #
      # The SKIP is a documented contract of the smoke
      # entry (packages/control-plane/test/smoke.test.ts: "dsh unavailable …
      # exits 0"), so it must NOT be turned into a red gate here; that would
      # make every ordinary push red and the release path could not run it at
      # all. Instead the step accepts exactly TWO outcomes and refuses every
      # other one: an explicit `SMOKE PASS`, or an explicit `SKIP: …` whose
      # reason is echoed as a workflow notice (visible in the run summary
      # instead of a green step that proves nothing). A silent exit 0 fails
      # the job.
      # `set -euo pipefail` is explicit (not inherited from the runner's shell
      # wrapper) so a real smoke failure can neither be swallowed by `tee` nor
      # fall through to a later command.
      - name: Smoke test (explicit SKIP, never an implicit pass)
        if: steps.classify.outputs.code == 'true'
        run: |
          set -euo pipefail
          pnpm run smoke | tee /tmp/dsh-chamber-smoke.log
          if grep -q '^SMOKE PASS$' /tmp/dsh-chamber-smoke.log; then
            echo "smoke exercised the control plane against a real dsh runtime"
          elif grep -q '^SKIP: ' /tmp/dsh-chamber-smoke.log; then
            echo "::notice title=smoke SKIPPED (not exercised)::$(grep -m1 '^SKIP: ' /tmp/dsh-chamber-smoke.log)"
          else
            echo "::error title=smoke produced neither a pass nor a skip::pnpm run smoke exited 0 without printing 'SMOKE PASS' or 'SKIP: <reason>'"
            exit 1
          fi
      - name: Renderer build
        if: steps.classify.outputs.code == 'true'
        run: pnpm run build:renderer
      # The renderer page bundle is a build output that appears AFTER
      # the package test suites, so no test-suite guard can see it. Assert the SVG
      # resource scoper code survived the build here, where the artifact exists.
      - name: Renderer page bundle carries the SVG scope code
        if: steps.classify.outputs.code == 'true'
        run: node scripts/gates/assert-scoper-artifact.mjs
      # Host-package esbuild bundles (dsh-chamber-seed-client-graph /
      # dsh-chamber-seed-git-worktree / dsh-chamber-seed-archive-cleanup /
      # dsh-chamber-seed-open-in — dist/index.js): their esbuild entry/external
      # mapping is an independent failure mode, so the push path validates them
      # too.
      - name: Host package builds
        if: steps.classify.outputs.code == 'true'
        run: pnpm run build:host-packages
      # Desktop packaging sub-steps shared with the shipped Swift sidecar
      # (control-plane bundle / host package) run in CI too — a PR breaking them
      # must not wait for a release to surface (bundle:dsh stays release-only: it
      # bakes the host platform's dsh runtime). The Electron preload build is NOT
      # in the default chain any more: the Electron flavor is ARCHIVED
      # (packages/desktop/electron/, docs/progress/electron-frozen.md).
      - name: Desktop build sub-steps
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm --filter @dsh-chamber/desktop run build:control-plane
          pnpm --filter @dsh-chamber/desktop run build:host-graph-package
      # Third-party notices must track the installed dependency set; a
      # stale committed file fails the push.
      - name: Third-party notices current
        if: steps.classify.outputs.code == 'true'
        run: node scripts/release/gen-third-party-notices.mjs && git diff --exit-code -- THIRD_PARTY_NOTICES.md docs/THIRD_PARTY_NOTICES.en-US.md
      - name: Gateway package build and installed CLI smoke
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm run build:dsh-runtime
          mkdir -p /tmp/dsh-gateway-pack /tmp/dsh-gateway-install
          pnpm --filter @dsh-chamber/gateway pack --pack-destination /tmp/dsh-gateway-pack
          npm install --ignore-scripts --prefix /tmp/dsh-gateway-install /tmp/dsh-gateway-pack/*.tgz
          /tmp/dsh-gateway-install/node_modules/.bin/gateway --help

  # macOS Swift shell leg (design 25): the SwiftPM package and the JS↔Swift
  # bridge manifest lockstep are macOS-only surfaces — without this job a
  # Swift/bridge regression lands unnoticed until a release. The packaging half
  # of the leg (the macOS-only desktop suites, the executed-assembly gates and
  # the dry runs) runs on a parallel runner in
  # test-macos-pack; this job keeps the Swift build/test core so a Swift-only
  # push gets its verdict without queueing behind packaging work. Deliberately
  # NOT a release job: the .app/sidecar assembly with the real Node download and
  # the signing/notarization chain stay in release.yml (network + credentials). A
  # prose-only push skips the whole leg through the same classifier as test.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The pinned harness source tree is a git submodule (gitlink ==
          # harness.commit); the Swift package itself has zero third-party
          # dependencies (AppKit/WebKit only).
          submodules: true
          # The change classifier diffs the pushed range, so both endpoints must
          # exist locally.
          fetch-depth: 0
      - name: Verify workflow action pins
        run: node scripts/gates/verify-workflow-action-pins.mjs
      # Same classifier as test: a prose-only branch push skips the
      # macOS runner (Swift build + packaging suites) entirely. Releases prove
      # THIS job's success on main through verify-release-ci-proof.mjs.
      - name: Classify the change (prose-only pushes skip the macOS/Swift leg)
        id: classify
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_AFTER: ${{ github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/gates/classify-ci-changes.mjs
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Bootstrap vendor tree (verify pin + ensure links)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/dev/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile
        if: steps.classify.outputs.code == 'true'
      - name: Assert lockfile not rewritten
        if: steps.classify.outputs.code == 'true'
        run: git diff --exit-code -- pnpm-lock.yaml
      # The Swift-sidecar integration cases spawn the sidecar entry from source,
      # which imports the untracked build-time artifacts (dsh-runtime dist and the
      # seed bundles). This leg never goes through run-checks, so it must bootstrap
      # them itself; without this a clean checkout dies with ERR_MODULE_NOT_FOUND
      # before any integration case can report.
      - name: Bootstrap untracked build-time artifacts (sidecar sources)
        if: steps.classify.outputs.code == 'true'
        run: pnpm run ensure:artifacts
      # DSH_CHAMBER_SHELL_NODE_BIN turns the 8 Swift↔sidecar integration tests from
      # XCTSkip into real runs (they spawn `node packages/desktop/sidecar-entry.ts`);
      # This raw step stays the release proof's pinned anchor
      # (REQUIRED_JOB_STEPS in release-workflow-policy.test.mjs); the gated
      # release run below is the one that enforces the shipped configuration.
      # SwiftPM 构建缓存：release 构建 62-81s 与测试编译的大头；键 = Package.resolved
      # （依赖一变即失效，restore-keys 仍复用同族缓存）。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: macos/.build
          key: swift-build-${{ hashFiles('macos/Package.resolved') }}
          restore-keys: |
            swift-build-
      - name: Swift build (release)
        if: steps.classify.outputs.code == 'true'
        working-directory: macos
        run: |
          export DSH_CHAMBER_SHELL_NODE_BIN="$(command -v node)"
          swift build -c release
      # The gate the local/tests mode uses (run-checks `test:swift`): pins
      # `swift test -c release` (the shipped native binary is a release
      # build, so the release configuration must be the one executed, not
      # merely compiled) and fails on ANY XCTSkip (the 8 sidecar
      # integration cases must run, never skip to green). The runner defaults
      # DSH_CHAMBER_SHELL_NODE_BIN to its own node, so the integration cases really spawn
      # `packages/desktop/sidecar-entry.ts`. Invoked directly (not through
      # package.json) so the CI contract does not depend on a script alias.
      - name: Swift tests (release configuration, XCTSkip == 0)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/gates/run-swift-tests.mjs
      # JS↔Swift bridge lockstep: the committed bridge-manifest.json /
      # BridgeManifest.swift must equal a regeneration, the shim surface must
      # match preload, and the payload SHAPE at every method call site must
      # match too (the manifest locks channels; the payload gate closes the
      # wire-shape gap). Re-running the cheap ones here keeps the macOS leg
      # self-contained when only Swift changes are pushed.
      - name: Bridge manifest + shim surface + payload shape lockstep
        if: steps.classify.outputs.code == 'true'
        run: |
          node packages/desktop/bridge-manifest.test.ts
          node packages/desktop/bridge-shim.test.ts
          node packages/desktop/bridge-shim-surface.test.ts
          node scripts/gates/verify-shim-payload-shape.mjs

  # macOS packaging half of the leg, split out of `test-macos` so the two run on
  # their own runners in parallel: the native-sidecar assembly gates and the
  # native dry runs share no state with the Swift build/test core and only need
  # the SwiftPM output for `test:macos`. This job restores the same caches and
  # rebuilds its own `macos/.build` (cache-backed, ~45s) instead of queueing
  # behind `swift test`. The Electron packaging rehearsal that used to live here
  # is ARCHIVED with the Electron flavor (docs/progress/electron-frozen.md): this
  # leg validates the SHIPPED native assembly only. Every step below is pinned as
  # REQUIRED_JOB_STEPS of THIS job by verify-release-ci-proof.mjs, so deleting or
  # renaming one still fails the release proof.
  test-macos-pack:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The pinned harness source tree is a git submodule (gitlink ==
          # harness.commit); the Swift package itself has zero third-party
          # dependencies (AppKit/WebKit only).
          submodules: true
          # The change classifier diffs the pushed range, so both endpoints must
          # exist locally.
          fetch-depth: 0
      - name: Verify workflow action pins
        run: node scripts/gates/verify-workflow-action-pins.mjs
      # The same change classifier as the core mac leg: a prose-only push skips
      # the packaging chain too (ci.yml owns no tag path; the proof watches this
      # job on main).
      - name: Classify the change (prose-only pushes skip the macOS packaging leg)
        id: classify
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_AFTER: ${{ github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/gates/classify-ci-changes.mjs
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Bootstrap vendor tree (verify pin + ensure links)
        if: steps.classify.outputs.code == 'true'
        run: node scripts/dev/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile
        if: steps.classify.outputs.code == 'true'
      - name: Assert lockfile not rewritten
        if: steps.classify.outputs.code == 'true'
        run: git diff --exit-code -- pnpm-lock.yaml
      # `test:macos` consumes the untracked build-time artifacts and the SwiftPM
      # `.build` output, so this job bootstraps and builds its own copies — it
      # never depends on the test-macos job having run first.
      - name: Bootstrap untracked build-time artifacts (sidecar sources)
        if: steps.classify.outputs.code == 'true'
        run: pnpm run ensure:artifacts
      # SwiftPM 构建缓存：release 构建 62-81s 与测试编译的大头；键 = Package.resolved
      # （依赖一变即失效，restore-keys 仍复用同族缓存）。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: macos/.build
          key: swift-build-${{ hashFiles('macos/Package.resolved') }}
          restore-keys: |
            swift-build-
      - name: Swift build (release, packaging leg)
        if: steps.classify.outputs.code == 'true'
        working-directory: macos
        run: |
          export DSH_CHAMBER_SHELL_NODE_BIN="$(command -v node)"
          swift build -c release
      # Packaging inputs, no network / no real Node download: the sidecar
      # assembly needs build:control-plane first, then both packaging scripts
      # validate their plans and layouts (the real Node fetch is release.yml).
      # macOS-only desktop suites (platform-qualified manifest): the darwin
      # O_EXLOCK lock assertions and the two packaging-script suites need macOS
      # tools (plutil/codesign/ditto), the SwiftPM .build output and
      # dist/control-plane — so they live in `test:macos` and run HERE, never in
      # the ubuntu `test` leg.
      - name: Packaging + darwin lock suites (test:macos)
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm --filter @dsh-chamber/desktop run build:control-plane
          pnpm --filter @dsh-chamber/desktop run test:macos
      # Executed-assembly gate: build the sidecar from the same sources
      # Swift ships (no network — --skip-node/--skip-vendor; the host packages
      # are not needed to boot and answer dsh-chamber:info) and run the REAL
      # sidecar.js with DSH_CHAMBER_SIDECAR_COMPILED=1. A bundle that cannot
      # boot fails here instead of after signing. A missing artifact is a hard
      # failure once the marker is set; without the marker the gate prints a
      # loud SKIP, never a silent pass.
      - name: Compiled sidecar smoke (shipped sidecar.js executes)
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm run build:sidecar --skip-node --skip-vendor --skip-host-packages
          DSH_CHAMBER_SIDECAR_COMPILED=1 node scripts/gates/compiled-sidecar-smoke.mjs
      # Native GUI acceptance gate: the native assembly the packaged Swift shell
      # spawns must actually launch and serve. This step drives the sidecar built
      # by the step above (the
      # NDJSON B bridge ready/info/settings frames, /health, the hostile-Origin
      # fence, the shell index served from a real web dist, and a clean
      # SIGTERM exit) and passes --require-assembly so a missing/skipped build
      # prerequisite is a hard FAIL instead of a loud SKIP. The WKWebView UI
      # and the .app double-click path still cannot be driven headlessly (no
      # CDP endpoint): those stay documented real-machine acceptance items.
      #
      # --web-dist: N-6（壳 index + 声明资源可服务）在 --require-assembly 下必须真执行，
      # 找不到 web dist 记 FAIL 而不是 INFO。本 job 在此步之前没有任何步骤产出 renderer
      # （ensure:artifacts 只自举 sidecar/host 产物；原先的 Electron 打包排练随冻结归档，
      # build:renderer 不再由别的步骤代跑），所以把 renderer 构建放进本步：产物落
      # packages/desktop/dist/web，由 --web-dist 显式交给走查（与 Swift 壳 AppDelegate 传
      # --web-dist-dir 的形状一致）。
      - name: Native assembly acceptance (spawned sidecar boots + serves)
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm run build:renderer
          node scripts/gui-acceptance/run.mjs --flavor native --require-assembly --web-dist packages/desktop/dist/web
      # Packaging dry runs (no network / no real Node download): the sidecar
      # assembly plan and the .app assembly plan validate their inputs.
      - name: Packaging dry runs (sidecar + .app)
        if: steps.classify.outputs.code == 'true'
        run: |
          pnpm run build:sidecar --dry-run
          pnpm run build:swift-app --dry-run --skip-build
