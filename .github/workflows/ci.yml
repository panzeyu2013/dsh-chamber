name: CI

on:
  push:
    branches: [main]
    # Tag pushes (v*) run the SAME validation chain — a release cannot be
    # published from an untested commit. release.yml also carries its own
    # release-local validation gate because tag-triggered workflows run in
    # parallel; keeping both paths aligned prevents either workflow from being
    # treated as proof for a different commit.
    tags: ['v*']
  pull_request:

jobs:
  # Validation chain only — no desktop packaging (fast). Packaging is built and
  # published exclusively by release.yml (tag v* / workflow_dispatch), where the
  # bundler runs with the DSH_CHAMBER_DSH_VERSION matching the committed runtime
  # lockfile. Keeping packaging out of the push path keeps ordinary pushes fast
  # (2026-08 decision): the v0.1.4 CI packaging jobs carried a stale hardcoded
  # DSH_CHAMBER_DSH_VERSION and failed every run with ERR_PNPM_OUTDATED_LOCKFILE
  # — if packaging jobs ever return to CI, their version env must be synced too.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The pinned harness source tree is a git submodule
          # (vendor/harness-checkout, gitlink == harness.commit). The gitlink
          # pins an exact commit, so the submodule is materialized at that
          # commit regardless of clone depth.
          submodules: true
      - name: Verify workflow action pins
        run: node scripts/dev/verify-workflow-action-pins.mjs
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # Bootstrap the vendor symlink tree BEFORE pnpm install: pnpm captures the
      # workspace snapshot before preinstall runs, so the links must already
      # exist for the install to resolve the full @deepseek-ai/* workspace.
      # The script verifies submodule HEAD == harness.commit (fail-closed on
      # drift) and is idempotent (no-op when the link set is unchanged).
      - name: Bootstrap vendor tree (verify pin + ensure links)
        run: node scripts/dev/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile
      # The lockfile is the deterministic contract between the committed
      # workspace members and the resolution result; a non-frozen install
      # must never silently rewrite it (pnpm 11 prunes symlinked-member
      # importer records). Fail the run if it moved.
      - name: Assert lockfile not rewritten
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Type check (tsc + chamber host packages + gateway)
        run: |
          pnpm run typecheck
          pnpm run typecheck:host-graph
          pnpm run typecheck:host-git
          pnpm run typecheck:host-archive-cleanup
          pnpm run typecheck:gateway
          pnpm run typecheck:runtime
      - name: i18n pair consistency
        run: pnpm run verify:i18n
      - name: Workflow action pins resolve upstream (release-preflight --actions-only)
        run: node scripts/dev/release-preflight.mjs --actions-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release workflow safety policy
        run: pnpm run test:release-workflow
      - name: Shared runtime core unit tests (packages/dsh-runtime)
        run: pnpm run test:runtime
      - name: Control-plane unit tests
        run: pnpm run test:control-plane
      - name: Desktop unit tests (lifecycle / transports / credentials / runtime / native edges)
        run: pnpm run test:desktop
      - name: Gateway unit tests
        run: pnpm run test:gateway
      - name: Renderer shell unit tests
        run: pnpm run test:renderer-shell
      - name: Client plugin type checks (sidebar / git / layout / connections / settings-bridge / client-web / connection / api-gateway / open-in / mobile)
        run: |
          pnpm run typecheck:sidebar
          pnpm run typecheck:git
          pnpm run typecheck:layout
          pnpm run typecheck:connections
          pnpm run typecheck:settings-bridge
          pnpm run typecheck:client-web
          pnpm run typecheck:connection
          pnpm run typecheck:api-gateway
          pnpm run typecheck:open-in
          pnpm run typecheck:mobile
      - name: Client and host plugin unit tests (sidebar / layout / git / settings-bridge / connections / client-web / connection / open-in / mobile)
        run: |
          pnpm run test:sidebar
          pnpm run test:layout
          pnpm run test:git
          pnpm run test:host-git
          pnpm run test:host-archive-cleanup
          pnpm run test:settings-bridge
          pnpm run test:connections
          pnpm run test:client-web
          pnpm run test:connection
          pnpm run test:open-in
          pnpm run test:mobile
          pnpm run test:cli
      # Runs `pnpm run smoke`; it SKIPs when the checkout carries no bundled
      # dsh runtime — normal here, since only
      # packages/desktop/vendor/dsh/pnpm-lock.yaml is committed and
      # node_modules is never committed; the gate requires a real dsh CLI
      # entry (2026-08 fix). The release path currently has NO smoke either:
      # release.yml's build jobs only package and structurally verify the
      # bundle (vendor/dsh presence + platform) — a smoke pass against the
      # freshly bundled runtime is not wired up anywhere.
      - name: Smoke test
        run: pnpm run smoke
      - name: Renderer build
        run: pnpm run build:renderer
      # Host-package esbuild bundles (dsh-host-client-graph / host-git-worktree
      # dist/index.js) only used to build in release — their esbuild entry/
      # external mapping is an independent failure mode, so the push path
      # validates them too (2026 round-3 review).
      - name: Host package builds
        run: pnpm run build:host-packages
      # Desktop packaging sub-steps (control-plane bundle / preload / host
      # package) run in CI too — a PR breaking them must not wait for a
      # release to surface (bundle:dsh stays release-only: it bakes the host
      # platform's dsh runtime).
      - name: Desktop build sub-steps
        run: |
          pnpm --filter @dsh-chamber/desktop run build:control-plane
          pnpm --filter @dsh-chamber/desktop run build:preload
          pnpm --filter @dsh-chamber/desktop run build:host-graph-package
      # Third-party notices must track the installed dependency set; a
      # stale committed file fails the push (2026 review).
      - name: Third-party notices current
        run: node scripts/dev/gen-third-party-notices.mjs && git diff --exit-code -- THIRD_PARTY_NOTICES.md docs/THIRD_PARTY_NOTICES.en-US.md
      - name: Gateway package build and installed CLI smoke
        run: |
          pnpm run build:dsh-runtime
          mkdir -p /tmp/dsh-gateway-pack /tmp/dsh-gateway-install
          pnpm --filter @dsh-chamber/gateway pack --pack-destination /tmp/dsh-gateway-pack
          npm install --ignore-scripts --prefix /tmp/dsh-gateway-install /tmp/dsh-gateway-pack/*.tgz
          /tmp/dsh-gateway-install/node_modules/.bin/gateway --help

  # Windows contract leg (Windows 首版推进, M0): mirrors the linux test job
  # for the platform-sensitive suites. This is where the win32-only lifecycle
  # integration tests run and where the remaining `skip: platform === 'win32'`
  # points are tracked (docs/progress/windows-baseline.md is the ledger).
  # Packaging stays in release.yml (build-windows); no smoke/builds here yet.
  test-windows:
    runs-on: windows-2022
    steps:
      # Normalize BEFORE checkout: actions/checkout materializes the tree with
      # the runner's global git config — autocrlf would rewrite text files and
      # make the lockfile diff assertion (below) fail on every run, and
      # core.symlinks=false would degrade any repository symlink to a plain
      # file copy.
      - name: Normalize git autocrlf and symlink handling
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The pinned harness source tree is a git submodule
          # (vendor/harness-checkout, gitlink == harness.commit). The gitlink
          # pins an exact commit, so the submodule is materialized at that
          # commit regardless of clone depth. STATUS.md tracks the remaining
          # acceptance: submodule materialization + junction link creation on
          # a real Windows runner (this job IS that acceptance).
          submodules: true
      - name: Verify workflow action pins
        run: node scripts/dev/verify-workflow-action-pins.mjs
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # Bootstrap the vendor symlink/junction tree BEFORE pnpm install (same
      # ordering rationale as the linux leg; ensure-harness-vendor.mjs already
      # creates junctions on win32).
      - name: Bootstrap vendor tree (verify pin + ensure links)
        run: node scripts/dev/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile
      - name: Assert lockfile not rewritten
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Type check (tsc + chamber host packages + gateway + runtime)
        run: |
          pnpm run typecheck
          pnpm run typecheck:host-graph
          pnpm run typecheck:host-git
          pnpm run typecheck:host-archive-cleanup
          pnpm run typecheck:gateway
          pnpm run typecheck:runtime
      # Windows leg consumes each package's platform manifest — `test:win32`
      # scripts in package.json are the single source of truth (structural
      # rule, 2026-09): no test file lists live in this YAML. Pre-M2b the
      # dsh-runtime store semantics are POSIX-only by design (private-fs fails
      # closed without O_NOFOLLOW), so the full POSIX suites run on the POSIX
      # legs; each package's test:win32 lists its win32-real / platform-
      # neutral gates and is extended as Windows semantics land (M2b) — in
      # the package, next to the tests, never here.
      - name: dsh-runtime test:win32 manifest
        run: pnpm --filter @dsh-chamber/dsh-runtime run test:win32
      - name: control-plane test:win32 manifest (real CIM/netstat/taskkill integration)
        run: pnpm --filter @dsh-chamber/control-plane run test:win32
      - name: desktop test:win32 manifest (real icacls)
        run: pnpm --filter @dsh-chamber/desktop run test:win32

  # macOS Swift shell leg (design 25, W-26): the SwiftPM package, the JS↔Swift
  # bridge manifest lockstep and the packaging inputs are macOS-only surfaces —
  # without this job a Swift/bridge/manifest regression lands unnoticed until a
  # release. Deliberately NOT a packaging job: the .app/sidecar assembly and
  # the real Node download stay in release.yml (network + credentials), and the
  # expensive desktop suite keeps running on the linux leg. The macOS-only
  # desktop tests (build-sidecar / build-swift-app packaging scripts, the
  # sidecar stdio smoke) already ride `test:desktop`; this job re-runs the two
  # cheapest bridge gates plus the Swift suite and the packaging dry runs.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The pinned harness source tree is a git submodule (gitlink ==
          # harness.commit); the Swift package itself has zero third-party
          # dependencies (AppKit/WebKit only).
          submodules: true
      - name: Verify workflow action pins
        run: node scripts/dev/verify-workflow-action-pins.mjs
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Bootstrap vendor tree (verify pin + ensure links)
        run: node scripts/dev/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile
      - name: Assert lockfile not rewritten
        run: git diff --exit-code -- pnpm-lock.yaml
      # POC_NODE_BIN turns the 8 Swift↔sidecar integration tests from
      # XCTSkip into real runs (they spawn `node packages/desktop/sidecar-entry.ts`);
      # locally verified 8/8 green with a plain node binary (2026-09 三审 #3).
      - name: Swift build (release) + XCTest
        working-directory: macos
        run: |
          export POC_NODE_BIN="$(command -v node)"
          swift build -c release
          swift test
      # JS↔Swift bridge lockstep: the committed bridge-manifest.json /
      # BridgeManifest.swift must equal a regeneration, and the shim surface
      # must match preload (both are in the desktop chain; re-running the two
      # cheap ones here keeps the macOS leg self-contained when only Swift
      # changes are pushed).
      - name: Bridge manifest + shim surface lockstep
        run: |
          node packages/desktop/bridge-manifest.test.ts
          node packages/desktop/bridge-shim.test.ts
          node packages/desktop/bridge-shim-surface.test.ts
      # Packaging inputs, no network / no real Node download: the sidecar
      # assembly needs build:control-plane first, then both packaging scripts
      # validate their plans and layouts (the real Node fetch is release.yml).
      # macOS-only desktop suites (platform-qualified manifest, same discipline
      # as test:win32): the darwin O_EXLOCK lock assertions and the two
      # packaging-script suites need macOS tools (plutil/codesign/ditto), the
      # SwiftPM .build output and dist/control-plane — so they live in
      # `test:macos` and run HERE, never in the ubuntu `test` leg.
      - name: Packaging + darwin lock suites (test:macos)
        run: |
          pnpm --filter @dsh-chamber/desktop run build:control-plane
          pnpm --filter @dsh-chamber/desktop run test:macos
      # Packaging dry runs (no network / no real Node download): the sidecar
      # assembly plan and the .app assembly plan validate their inputs.
      - name: Packaging dry runs (sidecar + .app)
        run: |
          pnpm run build:sidecar --dry-run
          pnpm run build:swift-app --dry-run --skip-build
