name: CI

on:
  push:
    branches: [main]
    # Tag pushes (v*) run the SAME validation chain — a release cannot be
    # published from an untested commit (2026 round-3 review: release.yml
    # itself only packages, never validates).
    tags: ['v*']
  pull_request:

jobs:
  # Validation chain only — no desktop packaging (fast). Packaging is built and
  # published exclusively by release.yml (tag v* / workflow_dispatch), where the
  # bundler runs with the DSH_CHAMBER_DSH_VERSION matching the committed runtime
  # lockfile. Keeping packaging out of the push path keeps ordinary pushes fast
  # (2026-08 decision): the v0.1.4 CI packaging jobs carried a stale hardcoded
  # DSH_CHAMBER_DSH_VERSION and failed every run with ERR_PNPM_OUTDATED_LOCKFILE
  # — if packaging jobs ever return to CI, their version env must be synced too.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify workflow action pins
        run: node scripts/verify-workflow-action-pins.mjs
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # Bootstrap the vendor symlink tree BEFORE pnpm install: pnpm captures the
      # workspace snapshot before preinstall runs, so the links must already
      # exist for the install to resolve the full @deepseek-ai/* workspace.
      # The managed snapshot (vendor/harness-checkout) is cached by pin; on a
      # cache hit the bootstrap reuses it, on a miss it downloads from codeload.
      - name: Cache pinned harness snapshot
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: vendor/harness-checkout
          key: harness-${{ hashFiles('harness.commit') }}
      - name: Bootstrap vendor tree
        run: node scripts/ensure-harness-vendor.mjs
      - run: pnpm install --frozen-lockfile
      - name: Type check (tsc + chamber host packages)
        run: |
          pnpm run typecheck
          pnpm run typecheck:host-graph
          pnpm run typecheck:host-git
      - name: i18n pair consistency
        run: pnpm run verify:i18n
      - name: Control-plane unit tests
        run: pnpm run test:control-plane
      - name: Desktop unit tests (transport / ssh)
        run: pnpm run test:desktop
      - name: Renderer shell unit tests
        run: pnpm run test:renderer-shell
      - name: Client plugin type checks (sidebar / git / layout / connections / settings-bridge / client-web / connection / open-in)
        run: |
          pnpm run typecheck:sidebar
          pnpm run typecheck:git
          pnpm run typecheck:layout
          pnpm run typecheck:connections
          pnpm run typecheck:settings-bridge
          pnpm run typecheck:client-web
          pnpm run typecheck:connection
          pnpm run typecheck:open-in
      - name: Client and host plugin unit tests (sidebar / git / settings-bridge / connections / client-web / connection / open-in)
        run: |
          pnpm run test:sidebar
          pnpm run test:git
          pnpm run test:host-git
          pnpm run test:settings-bridge
          pnpm run test:connections
          pnpm run test:client-web
          pnpm run test:connection
          pnpm run test:open-in
          pnpm run test:cli
      # Runs `pnpm run smoke`; it SKIPs when the checkout carries no bundled
      # dsh runtime — normal here, since only
      # packages/desktop/vendor/dsh/pnpm-lock.yaml is committed and
      # node_modules is never committed; the gate requires a real dsh CLI
      # entry (2026-08 fix). The release path currently has NO smoke either:
      # release.yml's build jobs only package and structurally verify the
      # bundle (vendor/dsh presence + platform) — a smoke pass against the
      # freshly bundled runtime is not wired up anywhere.
      - name: Smoke test
        run: pnpm run smoke
      - name: Renderer build
        run: pnpm run build:renderer
      # Host-package esbuild bundles (dsh-host-client-graph / host-git-worktree
      # dist/index.js) only used to build in release — their esbuild entry/
      # external mapping is an independent failure mode, so the push path
      # validates them too (2026 round-3 review).
      - name: Host package builds
        run: pnpm run build:host-packages
      # Desktop packaging sub-steps (control-plane bundle / preload / host
      # package) run in CI too — a PR breaking them must not wait for a
      # release to surface (bundle:dsh stays release-only: it bakes the host
      # platform's dsh runtime).
      - name: Desktop build sub-steps
        run: |
          pnpm --filter @dsh-chamber/desktop run build:control-plane
          pnpm --filter @dsh-chamber/desktop run build:preload
          pnpm --filter @dsh-chamber/desktop run build:host-graph-package
      # Third-party notices must track the installed dependency set; a
      # stale committed file fails the push (2026 review).
      - name: Third-party notices current
        run: node scripts/gen-third-party-notices.mjs && git diff --exit-code -- THIRD_PARTY_NOTICES.md docs/THIRD_PARTY_NOTICES.en-US.md
